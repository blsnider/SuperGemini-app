steps:
  # Build with no-cache flag and timestamp tag
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '--no-cache'
      - '-t'
      - 'us-central1-docker.pkg.dev/sis-sandbox-463113/super-gemini-repo/super-gemini:latest'
      - '-t'
      - 'us-central1-docker.pkg.dev/sis-sandbox-463113/super-gemini-repo/super-gemini:$BUILD_ID'
      - '.'

  # Push the image with both tags
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/sis-sandbox-463113/super-gemini-repo/super-gemini'

  # Deploy with the new image
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'supergemini-app'
      - '--image=us-central1-docker.pkg.dev/sis-sandbox-463113/super-gemini-repo/super-gemini:$BUILD_ID'
      - '--region=us-central1'
      - '--project=sis-sandbox-463113'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=supergemini-client@sis-sandbox-463113.iam.gserviceaccount.com'
      - '--port=8080'

timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'