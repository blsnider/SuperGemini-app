steps:
  # Build the Docker image with a unique tag
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', '--no-cache', '-t',
      'us-central1-docker.pkg.dev/sis-sandbox-463113/super-gemini-app/super-gemini-app:${SHORT_SHA}',
      '-t',
      'us-central1-docker.pkg.dev/sis-sandbox-463113/super-gemini-app/super-gemini-app:latest',
      '.'
    ]

  # Push the image with SHA tag
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'us-central1-docker.pkg.dev/sis-sandbox-463113/super-gemini-app/super-gemini-app:${SHORT_SHA}'
    ]

  # Push the image with latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'us-central1-docker.pkg.dev/sis-sandbox-463113/super-gemini-app/super-gemini-app:latest'
    ]

  # Deploy to Cloud Run with new service name
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run', 'deploy', 'super-gemini-app',
        '--image=us-central1-docker.pkg.dev/sis-sandbox-463113/super-gemini-app/super-gemini-app:${SHORT_SHA}',
        '--region=us-central1',
        '--project=sis-sandbox-463113',
        '--platform=managed',
        '--allow-unauthenticated',
        '--service-account=supergemini-client@sis-sandbox-463113.iam.gserviceaccount.com',
        '--port=8080',
        '--memory=2Gi',
        '--cpu=2',
        '--timeout=300',
        '--max-instances=10',
        '--min-instances=0',
        '--set-env-vars=ENVIRONMENT=production,BQ_PROJECT=scheels-data-marts,DEFAULT_MODEL=gemini-2.5-pro,ENABLE_WEIGHTING=True',
        '--set-secrets=GOOGLE_API_KEY=GOOGLE_API_KEY:latest,XAI_API_KEY=XAI_API_KEY:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest'
      ]

# Substitutions for dynamic values
substitutions:
  _SERVICE_NAME: super-gemini-app
  _REGION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: 'ALLOW_LOOSE'

timeout: 1200s