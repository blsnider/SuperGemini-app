steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', '-t',
      'us-central1-docker.pkg.dev/sis-sandbox-463113/super-gemini-repo/super-gemini:latest',
      '.'
    ]

  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'us-central1-docker.pkg.dev/sis-sandbox-463113/super-gemini-repo/super-gemini:latest'
    ]

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run', 'deploy', 'supergemini-app',
        '--image=us-central1-docker.pkg.dev/sis-sandbox-463113/super-gemini-repo/super-gemini:latest',
        '--region=us-central1',
        '--project=sis-sandbox-463113',
        '--platform=managed',
        '--allow-unauthenticated',
        '--service-account=supergemini-client@sis-sandbox-463113.iam.gserviceaccount.com',
        '--port=8080'
      ]