# MCP Toolbox Configuration - Enhanced Retail Analytics
# MCP runs in sis-sandbox-463113
# BigQuery data is in sis-data-marts

sources:
  # BigQuery warehouse source - pointing to correct data project
  bq-warehouse:
    kind: bigquery
    project: sis-data-marts
    location: us
    
  # BigQuery data marts source - pointing to correct data project
  bq-datamarts:
    kind: bigquery
    project: sis-data-marts
    location: us

tools:
  # Enhanced: Top selling items with shop support
  get_top_selling_items:
    kind: bigquery-sql
    source: bq-warehouse
    description: Get top selling items by units or revenue with comprehensive filters
    parameters:
      - name: store_id
        type: integer
        description: Store ID to filter (0 for all stores)
        default: 0
      - name: shop_id
        type: integer
        description: Shop ID to filter (0 for all shops)
        default: 0
      - name: year_filter
        type: integer
        description: Year to filter (0 for all years)
        default: 0
      - name: days_back
        type: integer
        description: Number of days to look back (0 for no time filter)
        default: 42
      - name: metric_type
        type: string
        description: Sort by 'units', 'revenue', or 'margin'
        default: revenue
      - name: limit
        type: integer
        description: Number of items to return
        default: 100
    statement: |
      WITH sales_data AS (
        SELECT 
          fs.sku_id,
          MAX(skus.as400_data.sku_description) as product_name,
          MAX(skus.as400_data.style) as style,
          MAX(skus.as400_data.vendor_name1) as vendor,
          MAX(skus.as400_data.specialty_shop_description) as shop_name,
          MAX(st.name) as store_name,
          SUM(fs.quantity) as total_units,
          SUM(fs.price_extended) as total_revenue,
          SUM(fs.cogs_extended) as total_cost,
          SUM(fs.price_extended) - SUM(fs.cogs_extended) as total_margin,
          SAFE_DIVIDE(SUM(fs.price_extended) - SUM(fs.cogs_extended), SUM(fs.price_extended)) * 100 as margin_pct,
          SAFE_DIVIDE(SUM(fs.price_extended), NULLIF(SUM(fs.quantity), 0)) as avg_unit_price
        FROM `sis-data-marts.warehouse.fct_sales` fs
        LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id
        LEFT JOIN `sis-data-marts.warehouse.dim_stores` st ON fs.store_id = st.dim_store_id
        WHERE 1=1
          AND (@store_id = 0 OR st.dim_store_id = @store_id)
          AND (@shop_id = 0 OR skus.specialty_shop = @shop_id)
          AND (@year_filter = 0 OR EXTRACT(YEAR FROM fs.transaction_datetime) = @year_filter)
          AND (@days_back = 0 OR DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL @days_back DAY))
        GROUP BY fs.sku_id
      )
      SELECT *
      FROM sales_data
      ORDER BY 
        CASE 
          WHEN @metric_type = 'units' THEN total_units
          WHEN @metric_type = 'revenue' THEN total_revenue
          WHEN @metric_type = 'margin' THEN total_margin
          ELSE total_revenue
        END DESC
      LIMIT @limit

  # NEW: Units vs Dollars Comparison
  get_units_vs_dollars_comparison:
    kind: bigquery-sql
    source: bq-warehouse
    description: Compare top items by units sold vs revenue generated
    parameters:
      - name: store_id
        type: integer
        description: Store ID to filter (0 for all)
        default: 0
      - name: shop_id
        type: integer
        description: Shop ID to filter (0 for all)
        default: 0
      - name: days_back
        type: integer
        description: Number of days to analyze
        default: 42
      - name: limit
        type: integer
        description: Top N items to compare
        default: 20
    statement: |
      WITH item_metrics AS (
        SELECT 
          fs.sku_id,
          MAX(skus.as400_data.sku_description) as product_name,
          MAX(skus.as400_data.style) as style,
          MAX(skus.as400_data.vendor_name1) as vendor,
          MAX(skus.as400_data.specialty_shop_description) as shop_name,
          SUM(fs.quantity) as total_units,
          SUM(fs.price_extended) as total_revenue,
          SAFE_DIVIDE(SUM(fs.price_extended), NULLIF(SUM(fs.quantity), 0)) as avg_price,
          SUM(fs.price_extended) - SUM(fs.cogs_extended) as total_margin,
          RANK() OVER (ORDER BY SUM(fs.quantity) DESC) as unit_rank,
          RANK() OVER (ORDER BY SUM(fs.price_extended) DESC) as revenue_rank
        FROM `sis-data-marts.warehouse.fct_sales` fs
        LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id
        WHERE DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL @days_back DAY)
          AND (@store_id = 0 OR fs.store_id = @store_id)
          AND (@shop_id = 0 OR skus.specialty_shop = @shop_id)
        GROUP BY fs.sku_id
      )
      SELECT 
        sku_id,
        product_name,
        style,
        vendor,
        shop_name,
        total_units,
        total_revenue,
        avg_price,
        total_margin,
        unit_rank,
        revenue_rank,
        ABS(unit_rank - revenue_rank) as rank_difference,
        CASE 
          WHEN unit_rank < revenue_rank THEN 'High Volume, Lower Price'
          WHEN unit_rank > revenue_rank THEN 'Low Volume, Higher Price'
          ELSE 'Balanced'
        END as item_profile
      FROM item_metrics
      WHERE unit_rank <= @limit OR revenue_rank <= @limit
      ORDER BY total_revenue DESC

  # NEW: Shop Performance Analysis
  get_shop_performance:
    kind: bigquery-sql
    source: bq-warehouse
    description: Analyze performance metrics by shop including margins and drivers
    parameters:
      - name: shop_id
        type: integer
        description: Specific shop to analyze (0 for all shops comparison)
        default: 0
      - name: store_id
        type: integer
        description: Store ID to filter (0 for all)
        default: 0
      - name: days_back
        type: integer
        description: Number of days to analyze
        default: 42
      - name: metric_focus
        type: string
        description: Focus on 'units', 'revenue', or 'margin'
        default: revenue
    statement: |
      WITH shop_metrics AS (
        SELECT 
          skus.specialty_shop as shop_id,
          MAX(skus.as400_data.specialty_shop_description) as shop_name,
          COUNT(DISTINCT fs.sku_id) as unique_skus,
          COUNT(DISTINCT fs.transaction_id) as transaction_count,
          SUM(fs.quantity) as total_units,
          SUM(fs.price_extended) as total_revenue,
          SUM(fs.cogs_extended) as total_cost,
          SUM(fs.price_extended) - SUM(fs.cogs_extended) as total_margin,
          SAFE_DIVIDE(SUM(fs.price_extended) - SUM(fs.cogs_extended), SUM(fs.price_extended)) * 100 as margin_pct,
          SAFE_DIVIDE(SUM(fs.price_extended), COUNT(DISTINCT fs.transaction_id)) as avg_transaction_value,
          SAFE_DIVIDE(SUM(fs.quantity), COUNT(DISTINCT fs.transaction_id)) as avg_units_per_transaction
        FROM `sis-data-marts.warehouse.fct_sales` fs
        LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id
        WHERE DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL @days_back DAY)
          AND (@shop_id = 0 OR skus.specialty_shop = @shop_id)
          AND (@store_id = 0 OR fs.store_id = @store_id)
        GROUP BY skus.specialty_shop
      ),
      shop_rankings AS (
        SELECT 
          *,
          RANK() OVER (ORDER BY total_units DESC) as unit_rank,
          RANK() OVER (ORDER BY total_revenue DESC) as revenue_rank,
          RANK() OVER (ORDER BY margin_pct DESC) as margin_rank,
          RANK() OVER (ORDER BY total_margin DESC) as margin_dollar_rank
        FROM shop_metrics
      )
      SELECT * FROM shop_rankings
      ORDER BY 
        CASE 
          WHEN @metric_focus = 'units' THEN unit_rank
          WHEN @metric_focus = 'revenue' THEN revenue_rank
          WHEN @metric_focus = 'margin' THEN margin_rank
          ELSE revenue_rank
        END

  # NEW: Sell-Through Rate Analysis
  get_sell_through_rates:
    kind: bigquery-sql
    source: bq-datamarts
    description: Calculate sell-through rates by units and dollars
    parameters:
      - name: store_id
        type: integer
        description: Store ID to filter (0 for all)
        default: 0
      - name: shop_id
        type: integer
        description: Shop ID to filter (0 for all)
        default: 0
      - name: days_period
        type: integer
        description: Period for sell-through calculation
        default: 30
      - name: min_beginning_inventory
        type: integer
        description: Minimum beginning inventory to include
        default: 10
    statement: |
      WITH beginning_inventory AS (
        SELECT 
          inv.sku_number,
          inv.store_number,
          inv.oh_units as beginning_units,
          inv.retail_extension as beginning_retail,
          inv.product_details.sku_description as product_name,
          inv.product_details.style as style,
          inv.product_details.specialty_shop as shop_id,
          inv.product_details.specialty_shop_description as shop_name
        FROM `sis-data-marts.data_marts.mart_inventory_snapshots` inv
        WHERE DATE(inv.snapshot_date) = DATE_SUB(CURRENT_DATE(), INTERVAL @days_period DAY)
          AND inv.oh_units >= @min_beginning_inventory
          AND (@store_id = 0 OR inv.store_number = @store_id)
          AND (@shop_id = 0 OR inv.product_details.specialty_shop = @shop_id)
      ),
      period_sales AS (
        SELECT 
          fs.sku_id,
          fs.store_id,
          SUM(fs.quantity) as units_sold,
          SUM(fs.price_extended) as revenue_sold
        FROM `sis-data-marts.warehouse.fct_sales` fs
        WHERE DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL @days_period DAY)
        GROUP BY fs.sku_id, fs.store_id
      ),
      current_inventory AS (
        SELECT 
          inv.sku_number,
          inv.store_number,
          inv.oh_units as ending_units,
          inv.retail_extension as ending_retail
        FROM `sis-data-marts.data_marts.mart_inventory_snapshots` inv
        WHERE inv.snapshot_date = (
          SELECT MAX(snapshot_date) 
          FROM `sis-data-marts.data_marts.mart_inventory_snapshots`
        )
      )
      SELECT 
        bi.sku_number,
        bi.store_number,
        bi.product_name,
        bi.style,
        bi.shop_name,
        bi.beginning_units,
        COALESCE(ps.units_sold, 0) as units_sold,
        COALESCE(ci.ending_units, 0) as ending_units,
        bi.beginning_retail,
        COALESCE(ps.revenue_sold, 0) as revenue_sold,
        COALESCE(ci.ending_retail, 0) as ending_retail,
        SAFE_DIVIDE(COALESCE(ps.units_sold, 0), bi.beginning_units) * 100 as unit_sell_through_pct,
        SAFE_DIVIDE(COALESCE(ps.revenue_sold, 0), bi.beginning_retail) * 100 as dollar_sell_through_pct,
        CASE 
          WHEN SAFE_DIVIDE(COALESCE(ps.units_sold, 0), bi.beginning_units) < 0.2 THEN 'Slow Moving'
          WHEN SAFE_DIVIDE(COALESCE(ps.units_sold, 0), bi.beginning_units) > 0.8 THEN 'Fast Moving'
          ELSE 'Normal'
        END as velocity_category
      FROM beginning_inventory bi
      LEFT JOIN period_sales ps ON bi.sku_number = ps.sku_id AND bi.store_number = ps.store_id
      LEFT JOIN current_inventory ci ON bi.sku_number = ci.sku_number AND bi.store_number = ci.store_number
      ORDER BY unit_sell_through_pct DESC

  # NEW: Time Period Comparison (YoY, MoM, Weekday/Weekend)
  get_time_period_comparison:
    kind: bigquery-sql
    source: bq-warehouse
    description: Compare sales across different time periods
    parameters:
      - name: comparison_type
        type: string
        description: Type of comparison - 'yoy', 'mom', 'wow', 'weekday_weekend'
        default: mom
      - name: store_id
        type: integer
        description: Store ID to filter (0 for all)
        default: 0
      - name: shop_id
        type: integer
        description: Shop ID to filter (0 for all)
        default: 0
      - name: aggregation_level
        type: string
        description: Level to aggregate - 'total', 'daily', 'shop'
        default: daily
    statement: |
      WITH time_metrics AS (
        SELECT 
          DATE(fs.transaction_datetime) as sale_date,
          EXTRACT(YEAR FROM fs.transaction_datetime) as year,
          EXTRACT(MONTH FROM fs.transaction_datetime) as month,
          EXTRACT(WEEK FROM fs.transaction_datetime) as week,
          EXTRACT(DAYOFWEEK FROM fs.transaction_datetime) as day_of_week,
          CASE 
            WHEN EXTRACT(DAYOFWEEK FROM fs.transaction_datetime) IN (1, 7) THEN 'Weekend'
            ELSE 'Weekday'
          END as day_type,
          MAX(skus.as400_data.specialty_shop_description) as shop_name,
          SUM(fs.quantity) as total_units,
          SUM(fs.price_extended) as total_revenue,
          SUM(fs.price_extended) - SUM(fs.cogs_extended) as total_margin,
          COUNT(DISTINCT fs.transaction_id) as transaction_count
        FROM `sis-data-marts.warehouse.fct_sales` fs
        LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id
        WHERE (@store_id = 0 OR fs.store_id = @store_id)
          AND (@shop_id = 0 OR skus.specialty_shop = @shop_id)
        GROUP BY 1, 2, 3, 4, 5, 6
      )
      SELECT 
        CASE 
          WHEN @comparison_type = 'yoy' THEN CAST(year AS STRING)
          WHEN @comparison_type = 'mom' THEN FORMAT_DATE('%Y-%m', sale_date)
          WHEN @comparison_type = 'wow' THEN FORMAT_DATE('%Y-W%W', sale_date)
          WHEN @comparison_type = 'weekday_weekend' THEN day_type
        END as period,
        CASE 
          WHEN @aggregation_level = 'shop' THEN shop_name
          WHEN @aggregation_level = 'daily' THEN CAST(sale_date AS STRING)
          ELSE 'Total'
        END as dimension,
        SUM(total_units) as total_units,
        SUM(total_revenue) as total_revenue,
        SUM(total_margin) as total_margin,
        SAFE_DIVIDE(SUM(total_margin), SUM(total_revenue)) * 100 as margin_pct,
        SUM(transaction_count) as transactions,
        SAFE_DIVIDE(SUM(total_revenue), SUM(transaction_count)) as avg_transaction_value,
        COUNT(DISTINCT sale_date) as days_in_period
      FROM time_metrics
      WHERE 
        CASE 
          WHEN @comparison_type = 'yoy' THEN year >= EXTRACT(YEAR FROM CURRENT_DATE()) - 1
          WHEN @comparison_type = 'mom' THEN sale_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 60 DAY)
          WHEN @comparison_type = 'wow' THEN sale_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 28 DAY)
          WHEN @comparison_type = 'weekday_weekend' THEN sale_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
        END
      GROUP BY 1, 2
      ORDER BY 1 DESC, total_revenue DESC

  # Enhanced: Inventory status with risk integration
  get_inventory_status:
    kind: bigquery-sql
    source: bq-datamarts
    description: Get current inventory status with coverage and risk assessment
    parameters:
      - name: store_id
        type: integer
        description: Store number to filter (0 for all)
        default: 0
      - name: shop_id
        type: integer
        description: Shop ID to filter (0 for all)
        default: 0
      - name: risk_level
        type: string
        description: Filter by risk level - 'all', 'critical', 'high', 'medium', 'low'
        default: all
      - name: min_on_hand
        type: integer
        description: Minimum on-hand units to include
        default: 0
      - name: limit
        type: integer
        description: Number of items to return
        default: 100
    statement: |
      WITH latest_inventory AS (
        SELECT 
          inv.sku_number,
          inv.store_number,
          inv.product_details.sku_description as product_name,
          inv.product_details.style as style,
          inv.product_details.specialty_shop as shop_id,
          inv.product_details.specialty_shop_description as shop_name,
          inv.store_details.store_city as store_city,
          inv.oh_units as current_on_hand,
          inv.retail_extension as retail_value,
          inv.cost_extension as cost_value,
          inv.snapshot_date
        FROM `sis-data-marts.data_marts.mart_inventory_snapshots` inv
        WHERE inv.snapshot_date = (
          SELECT MAX(snapshot_date) 
          FROM `sis-data-marts.data_marts.mart_inventory_snapshots`
        )
        AND inv.oh_units >= @min_on_hand
        AND (@store_id = 0 OR inv.store_number = @store_id)
        AND (@shop_id = 0 OR inv.product_details.specialty_shop = @shop_id)
      ),
      sales_velocity AS (
        SELECT 
          fs.sku_id,
          fs.store_id,
          SUM(CASE WHEN DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY) 
                   THEN fs.quantity ELSE 0 END) as units_30d,
          SUM(CASE WHEN DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY) 
                   THEN fs.quantity ELSE 0 END) as units_7d
        FROM `sis-data-marts.warehouse.fct_sales` fs
        WHERE DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
        GROUP BY fs.sku_id, fs.store_id
      )
      SELECT 
        li.*,
        COALESCE(sv.units_30d, 0) as units_sold_30d,
        COALESCE(sv.units_7d, 0) as units_sold_7d,
        CASE 
          WHEN COALESCE(sv.units_7d, 0) = 0 THEN 999
          ELSE ROUND(li.current_on_hand / (sv.units_7d / 7.0), 1)
        END as days_of_supply,
        CASE 
          WHEN li.current_on_hand = 0 AND COALESCE(sv.units_7d, 0) > 0 THEN 'Critical'
          WHEN li.current_on_hand / NULLIF(sv.units_7d / 7.0, 0) < 7 THEN 'High'
          WHEN li.current_on_hand / NULLIF(sv.units_7d / 7.0, 0) < 14 THEN 'Medium'
          ELSE 'Low'
        END as risk_level,
        ROUND(SAFE_DIVIDE(li.current_on_hand, NULLIF(sv.units_30d, 0)) * 30, 1) as coverage_days
      FROM latest_inventory li
      LEFT JOIN sales_velocity sv ON li.sku_number = sv.sku_id AND li.store_number = sv.store_id
      WHERE 
        CASE 
          WHEN @risk_level = 'all' THEN TRUE
          WHEN @risk_level = 'critical' THEN li.current_on_hand = 0 AND COALESCE(sv.units_7d, 0) > 0
          WHEN @risk_level = 'high' THEN li.current_on_hand / NULLIF(sv.units_7d / 7.0, 0) < 7
          WHEN @risk_level = 'medium' THEN li.current_on_hand / NULLIF(sv.units_7d / 7.0, 0) < 14
          WHEN @risk_level = 'low' THEN li.current_on_hand / NULLIF(sv.units_7d / 7.0, 0) >= 14 OR COALESCE(sv.units_7d, 0) = 0
        END
      ORDER BY 
        CASE 
          WHEN li.current_on_hand = 0 AND COALESCE(sv.units_7d, 0) > 0 THEN 1
          WHEN li.current_on_hand / NULLIF(sv.units_7d / 7.0, 0) < 7 THEN 2
          WHEN li.current_on_hand / NULLIF(sv.units_7d / 7.0, 0) < 14 THEN 3
          ELSE 4
        END,
        retail_value DESC
      LIMIT @limit

  # NEW: Inventory Risk Assessment with Priority Scoring
  get_inventory_risk_assessment:
    kind: bigquery-sql
    source: bq-datamarts
    description: Comprehensive inventory risk assessment with priority scores and recommendations
    parameters:
      - name: store_id
        type: integer
        description: Store number to filter (0 for all)
        default: 0
      - name: min_priority_score
        type: integer
        description: Minimum priority score (0-100)
        default: 0
      - name: include_overstocked
        type: boolean
        description: Include overstocked items in results
        default: true
      - name: limit
        type: integer
        description: Number of items to return
        default: 100
    statement: |
      WITH inventory_metrics AS (
        SELECT 
          inv.sku_number,
          inv.store_number,
          inv.product_details.sku_description as product_name,
          inv.product_details.style as style,
          inv.product_details.vendor_name as vendor,
          inv.store_details.store_city as store_city,
          inv.oh_units as current_on_hand,
          inv.retail_extension as retail_value,
          inv.cost_extension as cost_value
        FROM `sis-data-marts.data_marts.mart_inventory_snapshots` inv
        WHERE inv.snapshot_date = (
          SELECT MAX(snapshot_date) 
          FROM `sis-data-marts.data_marts.mart_inventory_snapshots`
        )
        AND (@store_id = 0 OR inv.store_number = @store_id)
      ),
      sales_patterns AS (
        SELECT 
          fs.sku_id,
          fs.store_id,
          SUM(CASE WHEN DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY) 
                   THEN fs.quantity ELSE 0 END) as units_7d,
          SUM(CASE WHEN DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY) 
                   THEN fs.quantity ELSE 0 END) as units_30d,
          SUM(CASE WHEN DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY) 
                   THEN fs.quantity ELSE 0 END) as units_90d,
          STDDEV(daily_units) as sales_volatility
        FROM (
          SELECT 
            sku_id,
            store_id,
            DATE(transaction_datetime) as sale_date,
            SUM(quantity) as daily_units
          FROM `sis-data-marts.warehouse.fct_sales`
          WHERE DATE(transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY)
          GROUP BY 1, 2, 3
        ) fs
        GROUP BY fs.sku_id, fs.store_id
      ),
      risk_scoring AS (
        SELECT 
          im.*,
          COALESCE(sp.units_7d, 0) as units_sold_7d,
          COALESCE(sp.units_30d, 0) as units_sold_30d,
          COALESCE(sp.units_90d, 0) as units_sold_90d,
          COALESCE(sp.sales_volatility, 0) as sales_volatility,
          -- Calculate various risk metrics
          CASE 
            WHEN COALESCE(sp.units_7d, 0) = 0 THEN 999
            ELSE ROUND(im.current_on_hand / (sp.units_7d / 7.0), 1)
          END as days_of_supply,
          SAFE_DIVIDE(im.current_on_hand, NULLIF(sp.units_30d / 30.0, 0)) as coverage_ratio,
          -- Priority score calculation (0-100)
          CASE
            -- Out of stock with recent sales = 100
            WHEN im.current_on_hand = 0 AND COALESCE(sp.units_7d, 0) > 0 THEN 100
            -- Critical low stock = 80-99
            WHEN im.current_on_hand > 0 AND im.current_on_hand / NULLIF(sp.units_7d / 7.0, 0) < 3 THEN 
              80 + (20 * (1 - im.current_on_hand / NULLIF(sp.units_7d / 7.0, 0) / 3))
            -- Low stock = 60-79
            WHEN im.current_on_hand / NULLIF(sp.units_7d / 7.0, 0) < 7 THEN 
              60 + (20 * (1 - (im.current_on_hand / NULLIF(sp.units_7d / 7.0, 0) - 3) / 4))
            -- Overstock = 20-40
            WHEN im.current_on_hand / NULLIF(sp.units_30d / 30.0, 0) > 90 THEN 
              20 + (20 * LEAST((im.current_on_hand / NULLIF(sp.units_30d / 30.0, 0) - 90) / 90, 1))
            -- Normal stock = 0-20
            ELSE GREATEST(0, 20 - (im.current_on_hand / NULLIF(sp.units_7d / 7.0, 0)))
          END as priority_score,
          -- Risk category
          CASE
            WHEN im.current_on_hand = 0 AND COALESCE(sp.units_7d, 0) > 0 THEN 'Out of Stock'
            WHEN im.current_on_hand / NULLIF(sp.units_7d / 7.0, 0) < 3 THEN 'Critical'
            WHEN im.current_on_hand / NULLIF(sp.units_7d / 7.0, 0) < 7 THEN 'High Risk'
            WHEN im.current_on_hand / NULLIF(sp.units_30d / 30.0, 0) > 90 THEN 'Overstocked'
            ELSE 'Normal'
          END as risk_category,
          -- Recommended action
          CASE
            WHEN im.current_on_hand = 0 AND COALESCE(sp.units_7d, 0) > 0 THEN 
              CONCAT('URGENT: Reorder ', CAST(CEIL(sp.units_30d / 30.0 * 14) AS STRING), ' units immediately')
            WHEN im.current_on_hand / NULLIF(sp.units_7d / 7.0, 0) < 7 THEN 
              CONCAT('Reorder ', CAST(CEIL(sp.units_30d / 30.0 * 30 - im.current_on_hand) AS STRING), ' units')
            WHEN im.current_on_hand / NULLIF(sp.units_30d / 30.0, 0) > 90 THEN 
              'Consider markdown or transfer'
            ELSE 'Monitor'
          END as recommended_action
        FROM inventory_metrics im
        LEFT JOIN sales_patterns sp ON im.sku_number = sp.sku_id AND im.store_number = sp.store_id
      )
      SELECT * FROM risk_scoring
      WHERE priority_score >= @min_priority_score
        AND (@include_overstocked OR risk_category != 'Overstocked')
      ORDER BY priority_score DESC, retail_value DESC
      LIMIT @limit

  # Enhanced: Sales trends with more granular options
  get_sales_trends:
    kind: bigquery-sql
    source: bq-warehouse
    description: Get detailed sales trends over time with multiple aggregation options
    parameters:
      - name: days_back
        type: integer
        description: Number of days to look back
        default: 42
      - name: store_id
        type: integer
        description: Store ID filter (0 for all)
        default: 0
      - name: shop_id
        type: integer
        description: Shop ID filter (0 for all)
        default: 0
      - name: granularity
        type: string
        description: Time granularity - 'daily', 'weekly', 'monthly'
        default: daily
      - name: include_comparisons
        type: boolean
        description: Include period-over-period comparisons
        default: true
    statement: |
      WITH sales_base AS (
        SELECT 
          DATE(fs.transaction_datetime) as sale_date,
          DATE_TRUNC(DATE(fs.transaction_datetime), WEEK) as sale_week,
          DATE_TRUNC(DATE(fs.transaction_datetime), MONTH) as sale_month,
          COUNT(DISTINCT fs.transaction_id) as transaction_count,
          COUNT(DISTINCT fs.sku_id) as unique_skus_sold,
          SUM(fs.quantity) as total_units,
          SUM(fs.price_extended) as total_revenue,
          SUM(fs.cogs_extended) as total_cost,
          SUM(fs.price_extended) - SUM(fs.cogs_extended) as total_margin
        FROM `sis-data-marts.warehouse.fct_sales` fs
        LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id
        WHERE DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL @days_back * 2 DAY)
          AND (@store_id = 0 OR fs.store_id = @store_id)
          AND (@shop_id = 0 OR skus.specialty_shop = @shop_id)
        GROUP BY 1, 2, 3
      ),
      aggregated AS (
        SELECT 
          CASE 
            WHEN @granularity = 'daily' THEN CAST(sale_date AS STRING)
            WHEN @granularity = 'weekly' THEN CAST(sale_week AS STRING)
            WHEN @granularity = 'monthly' THEN CAST(sale_month AS STRING)
          END as period,
          SUM(transaction_count) as transaction_count,
          SUM(unique_skus_sold) as unique_skus_sold,
          SUM(total_units) as total_units,
          SUM(total_revenue) as total_revenue,
          SUM(total_cost) as total_cost,
          SUM(total_margin) as total_margin,
          SAFE_DIVIDE(SUM(total_margin), SUM(total_revenue)) * 100 as margin_pct,
          SAFE_DIVIDE(SUM(total_revenue), SUM(transaction_count)) as avg_transaction_value,
          SAFE_DIVIDE(SUM(total_units), SUM(transaction_count)) as avg_units_per_transaction
        FROM sales_base
        WHERE sale_date >= DATE_SUB(CURRENT_DATE(), INTERVAL @days_back DAY)
        GROUP BY 1
      ),
      with_comparisons AS (
        SELECT 
          a.*,
          LAG(total_revenue, 1) OVER (ORDER BY period) as prev_period_revenue,
          LAG(total_units, 1) OVER (ORDER BY period) as prev_period_units,
          SAFE_DIVIDE(total_revenue - LAG(total_revenue, 1) OVER (ORDER BY period), 
                      LAG(total_revenue, 1) OVER (ORDER BY period)) * 100 as revenue_growth_pct,
          SAFE_DIVIDE(total_units - LAG(total_units, 1) OVER (ORDER BY period), 
                      LAG(total_units, 1) OVER (ORDER BY period)) * 100 as unit_growth_pct
        FROM aggregated a
      )
      SELECT * FROM with_comparisons
      ORDER BY period DESC

  # Enhanced: Top margin items with more detailed analysis
  get_top_margin_items:
    kind: bigquery-sql
    source: bq-warehouse
    description: Get items with highest profit margins including velocity considerations
    parameters:
      - name: limit
        type: integer
        description: Number of items to return
        default: 100
      - name: min_revenue
        type: integer
        description: Minimum revenue threshold
        default: 500
      - name: days_back
        type: integer
        description: Number of days to analyze
        default: 42
      - name: store_id
        type: integer
        description: Store ID filter (0 for all)
        default: 0
      - name: shop_id
        type: integer
        description: Shop ID filter (0 for all)
        default: 0
    statement: |
      WITH margin_analysis AS (
        SELECT 
          fs.sku_id,
          MAX(skus.as400_data.sku_description) as product_name,
          MAX(skus.as400_data.style) as style,
          MAX(skus.as400_data.vendor_name1) as vendor,
          MAX(skus.as400_data.specialty_shop_description) as shop_name,
          COUNT(DISTINCT fs.transaction_id) as transaction_count,
          COUNT(DISTINCT DATE(fs.transaction_datetime)) as days_sold,
          SUM(fs.quantity) as total_units,
          SUM(fs.price_extended) as total_revenue,
          SUM(fs.cogs_extended) as total_cost,
          SUM(fs.price_extended) - SUM(fs.cogs_extended) as total_margin,
          SAFE_DIVIDE(SUM(fs.price_extended) - SUM(fs.cogs_extended), SUM(fs.price_extended)) * 100 as margin_pct,
          SAFE_DIVIDE(SUM(fs.price_extended), NULLIF(SUM(fs.quantity), 0)) as avg_unit_price,
          SAFE_DIVIDE(SUM(fs.cogs_extended), NULLIF(SUM(fs.quantity), 0)) as avg_unit_cost
        FROM `sis-data-marts.warehouse.fct_sales` fs
        LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id
        WHERE DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL @days_back DAY)
          AND (@store_id = 0 OR fs.store_id = @store_id)
          AND (@shop_id = 0 OR skus.specialty_shop = @shop_id)
        GROUP BY fs.sku_id
        HAVING SUM(fs.price_extended) >= @min_revenue
      )
      SELECT 
        *,
        ROUND(total_units / NULLIF(days_sold, 0), 1) as avg_daily_units,
        ROUND(total_margin / NULLIF(days_sold, 0), 2) as avg_daily_margin,
        RANK() OVER (ORDER BY margin_pct DESC) as margin_pct_rank,
        RANK() OVER (ORDER BY total_margin DESC) as margin_dollar_rank,
        CASE 
          WHEN margin_pct >= 50 AND total_units >= 100 THEN 'Star Performer'
          WHEN margin_pct >= 50 AND total_units < 100 THEN 'High Margin Niche'
          WHEN margin_pct < 30 AND total_units >= 100 THEN 'Volume Driver'
          ELSE 'Standard'
        END as item_classification
      FROM margin_analysis
      WHERE margin_pct > 0
      ORDER BY 
        CASE 
          WHEN total_margin > 1000 AND margin_pct > 40 THEN 1  -- High dollar & high %
          WHEN margin_pct > 50 THEN 2  -- Very high %
          WHEN total_margin > 2000 THEN 3  -- High dollar
          ELSE 4
        END,
        total_margin DESC
      LIMIT @limit

  # Enhanced: Overstock analysis with markdown recommendations
  get_overstock_items:
    kind: bigquery-sql
    source: bq-datamarts
    description: Get items with excess inventory including markdown recommendations
    parameters:
      - name: store_id
        type: integer
        description: Store number to filter (0 for all)
        default: 0
      - name: shop_id
        type: integer
        description: Shop ID to filter (0 for all)
        default: 0
      - name: days_supply_threshold
        type: integer
        description: Minimum days supply to consider overstock
        default: 90
      - name: limit
        type: integer
        description: Number of items to return
        default: 100
    statement: |
      WITH latest_inventory AS (
        SELECT 
          inv.sku_number,
          inv.store_number,
          inv.product_details.sku_description as product_name,
          inv.product_details.style as style,
          inv.product_details.specialty_shop as shop_id,
          inv.product_details.specialty_shop_description as shop_name,
          inv.store_details.store_city as store_city,
          inv.oh_units as current_on_hand,
          inv.retail_extension as retail_value,
          inv.cost_extension as cost_value,
          inv.snapshot_date,
          SAFE_DIVIDE(inv.cost_extension, NULLIF(inv.oh_units, 0)) as unit_cost
        FROM `sis-data-marts.data_marts.mart_inventory_snapshots` inv
        WHERE inv.snapshot_date = (
          SELECT MAX(snapshot_date) 
          FROM `sis-data-marts.data_marts.mart_inventory_snapshots`
        )
        AND inv.oh_units > 0
        AND (@store_id = 0 OR inv.store_number = @store_id)
        AND (@shop_id = 0 OR inv.product_details.specialty_shop = @shop_id)
      ),
      sales_analysis AS (
        SELECT 
          fs.sku_id,
          fs.store_id,
          -- Recent sales velocity
          SUM(CASE WHEN DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY) 
                   THEN fs.quantity ELSE 0 END) as units_sold_30d,
          SUM(CASE WHEN DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY) 
                   THEN fs.quantity ELSE 0 END) as units_sold_90d,
          -- Price elasticity indicator
          AVG(fs.price_extended / NULLIF(fs.quantity, 0)) as avg_selling_price,
          STDDEV(fs.price_extended / NULLIF(fs.quantity, 0)) as price_variance,
          -- Seasonality check
          MAX(DATE(fs.transaction_datetime)) as last_sale_date
        FROM `sis-data-marts.warehouse.fct_sales` fs
        WHERE DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY)
        GROUP BY fs.sku_id, fs.store_id
      )
      SELECT 
        inv.sku_number,
        inv.store_number,
        inv.product_name,
        inv.style,
        inv.shop_name,
        inv.store_city,
        inv.current_on_hand,
        inv.retail_value,
        inv.cost_value,
        COALESCE(sa.units_sold_30d, 0) as units_sold_30d,
        COALESCE(sa.units_sold_90d, 0) as units_sold_90d,
        CASE 
          WHEN COALESCE(sa.units_sold_30d, 0) = 0 THEN 999
          ELSE ROUND(inv.current_on_hand / (sa.units_sold_30d / 30.0), 1)
        END as days_supply,
        DATE_DIFF(CURRENT_DATE(), COALESCE(sa.last_sale_date, DATE_SUB(CURRENT_DATE(), INTERVAL 999 DAY)), DAY) as days_since_last_sale,
        -- Markdown recommendations
        CASE 
          WHEN COALESCE(sa.units_sold_30d, 0) = 0 AND inv.current_on_hand > 20 THEN 50
          WHEN inv.current_on_hand / NULLIF(sa.units_sold_30d / 30.0, 0) > 180 THEN 40
          WHEN inv.current_on_hand / NULLIF(sa.units_sold_30d / 30.0, 0) > 120 THEN 30
          WHEN inv.current_on_hand / NULLIF(sa.units_sold_30d / 30.0, 0) > 90 THEN 20
          ELSE 0
        END as suggested_markdown_pct,
        CASE 
          WHEN COALESCE(sa.units_sold_30d, 0) = 0 THEN 'Dead Stock - Deep Markdown'
          WHEN inv.current_on_hand / NULLIF(sa.units_sold_30d / 30.0, 0) > 180 THEN 'Severe Overstock'
          WHEN inv.current_on_hand / NULLIF(sa.units_sold_30d / 30.0, 0) > 120 THEN 'Heavy Overstock'
          WHEN inv.current_on_hand / NULLIF(sa.units_sold_30d / 30.0, 0) > 90 THEN 'Moderate Overstock'
          ELSE 'Monitor'
        END as overstock_category
      FROM latest_inventory inv
      LEFT JOIN sales_analysis sa ON inv.sku_number = sa.sku_id AND inv.store_number = sa.store_id
      WHERE (CASE 
          WHEN COALESCE(sa.units_sold_30d, 0) = 0 THEN 999
          ELSE inv.current_on_hand / (sa.units_sold_30d / 30.0)
        END) >= @days_supply_threshold
      ORDER BY inv.retail_value DESC
      LIMIT @limit

  # Enhanced: Comparison analysis with more metrics
  get_comparison_analysis:
    kind: bigquery-sql
    source: bq-warehouse
    description: Compare performance between stores, shops, or time periods
    parameters:
      - name: comparison_type
        type: string
        description: Type of comparison - 'store', 'shop', 'period'
        default: store
      - name: entity1_id
        type: integer
        description: First entity ID (store, shop, or days back for period)
        default: 64
      - name: entity2_id
        type: integer
        description: Second entity ID
        default: 65
      - name: days_back
        type: integer
        description: Number of days to analyze
        default: 42
      - name: metric_focus
        type: string
        description: Primary metric - 'revenue', 'units', 'margin', 'all'
        default: all
      - name: limit
        type: integer
        description: Number of items to compare
        default: 25
    statement: |
      WITH entity1_sales AS (
        SELECT 
          fs.sku_id,
          MAX(skus.as400_data.sku_description) as product_name,
          MAX(skus.as400_data.style) as style,
          MAX(skus.as400_data.vendor_name1) as vendor,
          MAX(skus.as400_data.specialty_shop_description) as shop_name,
          SUM(fs.quantity) as entity1_units,
          SUM(fs.price_extended) as entity1_revenue,
          SUM(fs.price_extended) - SUM(fs.cogs_extended) as entity1_margin,
          SAFE_DIVIDE(SUM(fs.price_extended) - SUM(fs.cogs_extended), SUM(fs.price_extended)) * 100 as entity1_margin_pct,
          COUNT(DISTINCT fs.transaction_id) as entity1_transactions,
          COUNT(DISTINCT DATE(fs.transaction_datetime)) as entity1_days_sold
        FROM `sis-data-marts.warehouse.fct_sales` fs
        LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id
        WHERE DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL @days_back DAY)
          AND CASE 
            WHEN @comparison_type = 'store' THEN fs.store_id = @entity1_id
            WHEN @comparison_type = 'shop' THEN skus.specialty_shop = @entity1_id
            WHEN @comparison_type = 'period' THEN DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL @entity1_id DAY)
              AND DATE(fs.transaction_datetime) < DATE_SUB(CURRENT_DATE(), INTERVAL @entity2_id DAY)
          END
        GROUP BY fs.sku_id
      ),
      entity2_sales AS (
        SELECT 
          fs.sku_id,
          SUM(fs.quantity) as entity2_units,
          SUM(fs.price_extended) as entity2_revenue,
          SUM(fs.price_extended) - SUM(fs.cogs_extended) as entity2_margin,
          SAFE_DIVIDE(SUM(fs.price_extended) - SUM(fs.cogs_extended), SUM(fs.price_extended)) * 100 as entity2_margin_pct,
          COUNT(DISTINCT fs.transaction_id) as entity2_transactions,
          COUNT(DISTINCT DATE(fs.transaction_datetime)) as entity2_days_sold
        FROM `sis-data-marts.warehouse.fct_sales` fs
        LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id
        WHERE DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL @days_back DAY)
          AND CASE 
            WHEN @comparison_type = 'store' THEN fs.store_id = @entity2_id
            WHEN @comparison_type = 'shop' THEN skus.specialty_shop = @entity2_id
            WHEN @comparison_type = 'period' THEN DATE(fs.transaction_datetime) < DATE_SUB(CURRENT_DATE(), INTERVAL @entity2_id DAY)
          END
        GROUP BY fs.sku_id
      ),
      combined AS (
        SELECT 
          COALESCE(e1.sku_id, e2.sku_id) as sku_id,
          e1.product_name,
          e1.style,
          e1.vendor,
          e1.shop_name,
          -- Entity 1 metrics
          COALESCE(e1.entity1_units, 0) as entity1_units,
          COALESCE(e1.entity1_revenue, 0) as entity1_revenue,
          COALESCE(e1.entity1_margin, 0) as entity1_margin,
          COALESCE(e1.entity1_margin_pct, 0) as entity1_margin_pct,
          COALESCE(e1.entity1_transactions, 0) as entity1_transactions,
          -- Entity 2 metrics
          COALESCE(e2.entity2_units, 0) as entity2_units,
          COALESCE(e2.entity2_revenue, 0) as entity2_revenue,
          COALESCE(e2.entity2_margin, 0) as entity2_margin,
          COALESCE(e2.entity2_margin_pct, 0) as entity2_margin_pct,
          COALESCE(e2.entity2_transactions, 0) as entity2_transactions,
          -- Variance analysis
          COALESCE(e1.entity1_units, 0) - COALESCE(e2.entity2_units, 0) as unit_variance,
          COALESCE(e1.entity1_revenue, 0) - COALESCE(e2.entity2_revenue, 0) as revenue_variance,
          SAFE_DIVIDE(COALESCE(e1.entity1_revenue, 0) - COALESCE(e2.entity2_revenue, 0), 
                      NULLIF(e2.entity2_revenue, 0)) * 100 as revenue_variance_pct,
          -- Performance indicators
          CASE 
            WHEN COALESCE(e1.entity1_revenue, 0) > COALESCE(e2.entity2_revenue, 0) * 1.2 THEN 'Outperforming'
            WHEN COALESCE(e1.entity1_revenue, 0) < COALESCE(e2.entity2_revenue, 0) * 0.8 THEN 'Underperforming'
            ELSE 'Similar'
          END as performance_status
        FROM entity1_sales e1
        FULL OUTER JOIN entity2_sales e2 ON e1.sku_id = e2.sku_id
      )
      SELECT * FROM combined
      WHERE 
        CASE 
          WHEN @metric_focus = 'revenue' THEN entity1_revenue > 0 OR entity2_revenue > 0
          WHEN @metric_focus = 'units' THEN entity1_units > 0 OR entity2_units > 0
          WHEN @metric_focus = 'margin' THEN entity1_margin > 0 OR entity2_margin > 0
          ELSE entity1_revenue > 0 OR entity2_revenue > 0
        END
      ORDER BY 
        CASE 
          WHEN @metric_focus = 'revenue' THEN ABS(revenue_variance)
          WHEN @metric_focus = 'units' THEN ABS(unit_variance)
          WHEN @metric_focus = 'margin' THEN ABS(entity1_margin - entity2_margin)
          ELSE entity1_revenue + entity2_revenue
        END DESC
      LIMIT @limit

  # Out of stock items (kept from original with minor enhancements)
  get_out_of_stock_items:
    kind: bigquery-sql
    source: bq-datamarts
    description: Get items that are out of stock with recent sales history
    parameters:
      - name: store_id
        type: integer
        description: Store number to filter (0 for all)
        default: 0
      - name: shop_id
        type: integer
        description: Shop ID to filter (0 for all)
        default: 0
      - name: min_sales_30d
        type: integer
        description: Minimum sales in last 30 days
        default: 1
      - name: limit
        type: integer
        description: Number of items to return
        default: 100
    statement: |
      WITH out_of_stock AS (
        SELECT 
          inv.sku_number,
          inv.store_number,
          inv.product_details.sku_description as product_name,
          inv.product_details.style as style,
          inv.product_details.specialty_shop as shop_id,
          inv.product_details.specialty_shop_description as shop_name,
          inv.store_details.store_city as store_city,
          inv.snapshot_date
        FROM `sis-data-marts.data_marts.mart_inventory_snapshots` inv
        WHERE inv.snapshot_date = (
          SELECT MAX(snapshot_date) 
          FROM `sis-data-marts.data_marts.mart_inventory_snapshots`
        )
        AND inv.oh_units = 0
        AND (@store_id = 0 OR inv.store_number = @store_id)
        AND (@shop_id = 0 OR inv.product_details.specialty_shop = @shop_id)
      ),
      recent_sales AS (
        SELECT 
          fs.sku_id,
          fs.store_id,
          SUM(fs.quantity) as units_sold_30d,
          SUM(fs.price_extended) as revenue_30d,
          AVG(fs.price_extended / NULLIF(fs.quantity, 0)) as avg_price,
          MAX(DATE(fs.transaction_datetime)) as last_sale_date,
          COUNT(DISTINCT DATE(fs.transaction_datetime)) as days_with_sales
        FROM `sis-data-marts.warehouse.fct_sales` fs
        WHERE DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
        GROUP BY fs.sku_id, fs.store_id
        HAVING SUM(fs.quantity) >= @min_sales_30d
      )
      SELECT 
        oos.sku_number,
        oos.store_number,
        oos.product_name,
        oos.style,
        oos.shop_name,
        oos.store_city,
        rs.units_sold_30d,
        rs.revenue_30d,
        rs.avg_price,
        ROUND(rs.units_sold_30d / 30.0, 1) as daily_velocity,
        rs.last_sale_date,
        DATE_DIFF(CURRENT_DATE(), rs.last_sale_date, DAY) as days_out_of_stock,
        rs.revenue_30d * DATE_DIFF(CURRENT_DATE(), rs.last_sale_date, DAY) / 30.0 as estimated_lost_revenue
      FROM out_of_stock oos
      INNER JOIN recent_sales rs ON oos.sku_number = rs.sku_id AND oos.store_number = rs.store_id
      ORDER BY rs.revenue_30d DESC
      LIMIT @limit

toolsets:
  retail_analytics:
    - get_top_selling_items
    - get_units_vs_dollars_comparison
    - get_shop_performance
    - get_sell_through_rates
    - get_time_period_comparison
    - get_inventory_status
    - get_inventory_risk_assessment
    - get_out_of_stock_items
    - get_sales_trends
    - get_top_margin_items
    - get_overstock_items
    - get_comparison_analysis