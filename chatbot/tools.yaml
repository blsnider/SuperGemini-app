# MCP Toolbox Configuration - Fixed with Correct Project IDs
# MCP runs in sis-sandbox-463113
# BigQuery data is in sis-data-marts

sources:
  # BigQuery warehouse source - pointing to correct data project
  bq-warehouse:
    kind: bigquery
    project: sis-data-marts  # Changed from sis-sandbox-463113
    location: us
    
  # BigQuery data marts source - pointing to correct data project
  bq-datamarts:
    kind: bigquery
    project: sis-data-marts  # Changed from sis-sandbox-463113
    location: us

tools:
  # Top selling items with individual parameters
  get_top_selling_items:
    kind: bigquery-sql
    source: bq-warehouse
    description: Get top selling items with optional filters
    parameters:
      - name: store_id
        type: integer
        description: Store ID to filter (0 for all stores)
        default: 0
      - name: shop_id
        type: integer
        description: Shop ID to filter (0 for all shops)
        default: 0
      - name: year_filter
        type: integer
        description: Year to filter (0 for all years)
        default: 0
      - name: days_back
        type: integer
        description: Number of days to look back (0 for no time filter)
        default: 42
      - name: limit
        type: integer
        description: Number of items to return
        default: 100
    statement: |
      WITH sales_data AS (
        SELECT 
          fs.sku_id,
          MAX(skus.as400_data.sku_description) as product_name,
          MAX(skus.as400_data.style) as style,
          MAX(skus.as400_data.vendor_name1) as vendor,
          MAX(skus.as400_data.specialty_shop_description) as shop_name,
          MAX(st.name) as store_name,
          SUM(fs.quantity) as total_units,
          SUM(fs.price_extended) as total_revenue,
          SUM(fs.cogs_extended) as total_cost,
          SAFE_DIVIDE(SUM(fs.price_extended) - SUM(fs.cogs_extended), SUM(fs.price_extended)) * 100 as margin_pct
        FROM `sis-data-marts.warehouse.fct_sales` fs
        LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id
        LEFT JOIN `sis-data-marts.warehouse.dim_stores` st ON fs.store_id = st.dim_store_id
        WHERE 1=1
          AND (@store_id = 0 OR st.dim_store_id = @store_id)
          AND (@shop_id = 0 OR skus.specialty_shop = @shop_id)
          AND (@year_filter = 0 OR EXTRACT(YEAR FROM fs.transaction_datetime) = @year_filter)
          AND (@days_back = 0 OR DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL @days_back DAY))
        GROUP BY fs.sku_id
      )
      SELECT *
      FROM sales_data
      ORDER BY total_revenue DESC
      LIMIT @limit

  # Inventory status
  get_inventory_status:
    kind: bigquery-sql
    source: bq-datamarts
    description: Get current inventory status with optional store filter
    parameters:
      - name: store_id
        type: integer
        description: Store number to filter (0 for all)
        default: 0
      - name: shop_id
        type: integer
        description: Shop ID to filter (0 for all shops)
        default: 0
      - name: min_on_hand
        type: integer
        description: Minimum on-hand units to include
        default: 0
      - name: limit
        type: integer
        description: Number of items to return
        default: 100
    statement: |
      WITH recent_snapshot AS (
        SELECT MAX(snapshot_date) as max_date
        FROM `sis-data-marts.data_marts.mart_inventory_snapshots`
        WHERE snapshot_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY)
          AND snapshot_date < CURRENT_DATE()
      ),
      latest_inventory AS (
        SELECT 
          inv.sku_number,
          inv.store_number,
          inv.product_details.sku_description as product_name,
          inv.product_details.style as style,
          COALESCE(skus.specialty_shop, 0) as shop_id,
          COALESCE(skus.as400_data.specialty_shop_description, inv.product_details.specialty_shop_description, '') as shop_name,
          inv.store_details.store_city as store_city,
          inv.oh_units as current_on_hand,
          inv.retail_extension as retail_value,
          inv.cost_extension as cost_value,
          inv.snapshot_date
        FROM `sis-data-marts.data_marts.mart_inventory_snapshots` inv
        CROSS JOIN recent_snapshot rs
        LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON inv.sku_number = skus.dim_sku_id
        WHERE inv.snapshot_date = rs.max_date
        AND inv.oh_units >= @min_on_hand
        AND (@store_id = 0 OR inv.store_number = @store_id)
        AND (@shop_id = 0 OR skus.specialty_shop = @shop_id OR skus.specialty_shop IS NULL)
      )
      SELECT *
      FROM latest_inventory
      ORDER BY retail_value DESC
      LIMIT @limit

  # Out of stock items
  get_out_of_stock_items:
    kind: bigquery-sql
    source: bq-datamarts
    description: Get items that are out of stock with recent sales
    parameters:
      - name: store_id
        type: integer
        description: Store number to filter (0 for all)
        default: 0
      - name: shop_id
        type: integer
        description: Shop ID to filter (0 for all shops)
        default: 0
      - name: min_sales_30d
        type: integer
        description: Minimum sales in last 30 days
        default: 1
      - name: limit
        type: integer
        description: Number of items to return
        default: 100
    statement: |
      WITH out_of_stock AS (
        SELECT 
          inv.sku_number,
          inv.store_number,
          inv.oh_units
        FROM `sis-data-marts.data_marts.mart_current_on_hand` inv
        LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON inv.sku_number = skus.dim_sku_id
        WHERE 
       inv.oh_units = 0
        AND (@store_id = 0 OR inv.store_number = @store_id)
        AND (@shop_id = 0 OR skus.specialty_shop = @shop_id OR skus.specialty_shop IS NULL)
      ),
      recent_sales AS (
        SELECT 
          fs.sku_id,
          fs.store_id,
          SUM(fs.quantity) as units_sold_30d,
          SUM(fs.price_extended) as revenue_30d
        FROM `sis-data-marts.warehouse.fct_sales` fs
        LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id
        WHERE DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
          AND (@shop_id = 0 OR skus.specialty_shop = @shop_id)
        GROUP BY fs.sku_id, fs.store_id
        HAVING SUM(fs.quantity) >= @min_sales_30d
      )
      SELECT 
        oos.sku_number,
        oos.store_number,
        rs.units_sold_30d,
        rs.revenue_30d,
        ROUND(rs.units_sold_30d / 30.0, 1) as daily_velocity
      FROM out_of_stock oos
      INNER JOIN recent_sales rs ON oos.sku_number = rs.sku_id AND oos.store_number = rs.store_id
      ORDER BY rs.revenue_30d DESC
      LIMIT @limit

  # Sales trends
  get_sales_trends:
    kind: bigquery-sql
    source: bq-warehouse
    description: Get sales trends over time
    parameters:
      - name: days_back
        type: integer
        description: Number of days to look back
        default: 42
      - name: store_id
        type: integer
        description: Store ID filter (0 for all)
        default: 0
      - name: shop_id
        type: integer
        description: Shop ID filter (0 for all)
        default: 0
    statement: |
      SELECT 
        DATE(fs.transaction_datetime) as sale_date,
        COUNT(DISTINCT fs.transaction_id) as transaction_count,
        SUM(fs.quantity) as total_units,
        SUM(fs.price_extended) as total_revenue,
        SUM(fs.cogs_extended) as total_cost,
        ROUND(SUM(fs.price_extended) - SUM(fs.cogs_extended), 2) as total_margin,
        ROUND(SAFE_DIVIDE(SUM(fs.price_extended) - SUM(fs.cogs_extended), SUM(fs.price_extended)) * 100, 1) as margin_pct
      FROM `sis-data-marts.warehouse.fct_sales` fs
      LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id
      LEFT JOIN `sis-data-marts.warehouse.dim_stores` st ON fs.store_id = st.dim_store_id
      WHERE DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL @days_back DAY)
        AND (@store_id = 0 OR st.dim_store_id = @store_id)
        AND (@shop_id = 0 OR skus.specialty_shop = @shop_id)
      GROUP BY DATE(fs.transaction_datetime)
      ORDER BY sale_date DESC

  # Top margin items
  get_top_margin_items:
    kind: bigquery-sql
    source: bq-warehouse
    description: Get items with highest profit margins
    parameters:
      - name: store_id
        type: integer
        description: Store ID to filter (0 for all stores)
        default: 0
      - name: shop_id
        type: integer
        description: Shop ID to filter (0 for all shops)
        default: 0
      - name: limit
        type: integer
        description: Number of items to return
        default: 100
      - name: min_revenue
        type: integer
        description: Minimum revenue threshold
        default: 500
      - name: days_back
        type: integer
        description: Number of days to analyze
        default: 42
    statement: |
      WITH margin_analysis AS (
        SELECT 
          fs.sku_id,
          MAX(skus.as400_data.sku_description) as product_name,
          MAX(skus.as400_data.style) as style,
          MAX(skus.as400_data.vendor_name1) as vendor,
          MAX(skus.as400_data.specialty_shop_description) as shop_name,
          MAX(st.name) as store_name,
          SUM(fs.quantity) as total_units,
          SUM(fs.price_extended) as total_revenue,
          SUM(fs.cogs_extended) as total_cost,
          SUM(fs.price_extended) - SUM(fs.cogs_extended) as total_margin,
          SAFE_DIVIDE(SUM(fs.price_extended) - SUM(fs.cogs_extended), SUM(fs.price_extended)) * 100 as margin_pct
        FROM `sis-data-marts.warehouse.fct_sales` fs
        LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id
        LEFT JOIN `sis-data-marts.warehouse.dim_stores` st ON fs.store_id = st.dim_store_id
        WHERE DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL @days_back DAY)
          AND (@store_id = 0 OR st.dim_store_id = @store_id)
          AND (@shop_id = 0 OR skus.specialty_shop = @shop_id)
        GROUP BY fs.sku_id
        HAVING SUM(fs.price_extended) >= @min_revenue
      )
      SELECT *
      FROM margin_analysis
      WHERE margin_pct > 0
      ORDER BY margin_pct DESC, total_margin DESC
      LIMIT @limit

  # Overstock analysis
  get_overstock_items:
    kind: bigquery-sql
    source: bq-datamarts
    description: Get items with excess inventory (90+ days supply)
    parameters:
      - name: store_id
        type: integer
        description: Store number to filter (0 for all)
        default: 0
      - name: shop_id
        type: integer
        description: Shop ID to filter (0 for all shops)
        default: 0
      - name: days_supply_threshold
        type: integer
        description: Minimum days supply to consider overstock
        default: 90
      - name: limit
        type: integer
        description: Number of items to return
        default: 100
    statement: |
      WITH recent_snapshot AS (
        SELECT MAX(snapshot_date) as max_date
        FROM `sis-data-marts.data_marts.mart_inventory_snapshots`
        WHERE snapshot_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY)
          AND snapshot_date < CURRENT_DATE()
      ),
      latest_inventory AS (
        SELECT 
          inv.sku_number,
          inv.store_number,
          inv.product_details.sku_description as product_name,
          inv.product_details.style as style,
          COALESCE(skus.specialty_shop, 0) as shop_id,
          COALESCE(skus.as400_data.specialty_shop_description, inv.product_details.specialty_shop_description, '') as shop_name,
          inv.store_details.store_city as store_city,
          inv.oh_units as current_on_hand,
          inv.retail_extension as retail_value,
          inv.cost_extension as cost_value,
          inv.snapshot_date
        FROM `sis-data-marts.data_marts.mart_inventory_snapshots` inv
        CROSS JOIN recent_snapshot rs
        LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON inv.sku_number = skus.dim_sku_id
        WHERE inv.snapshot_date = rs.max_date
        AND inv.oh_units > 0
        AND (@store_id = 0 OR inv.store_number = @store_id)
        AND (@shop_id = 0 OR skus.specialty_shop = @shop_id OR skus.specialty_shop IS NULL)
      ),
      sales_velocity AS (
        SELECT 
          fs.sku_id,
          fs.store_id,
          SUM(CASE WHEN DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY) 
                   THEN fs.quantity ELSE 0 END) as units_sold_30d
        FROM `sis-data-marts.warehouse.fct_sales` fs
        LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id
        WHERE DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
          AND (@shop_id = 0 OR skus.specialty_shop = @shop_id)
        GROUP BY fs.sku_id, fs.store_id
      )
      SELECT 
        inv.sku_number,
        inv.store_number,
        inv.product_name,
        inv.style,
        inv.store_city,
        inv.current_on_hand,
        inv.retail_value,
        COALESCE(sv.units_sold_30d, 0) as units_sold_30d,
        CASE 
          WHEN COALESCE(sv.units_sold_30d, 0) = 0 THEN 999
          ELSE ROUND(inv.current_on_hand / (sv.units_sold_30d / 30.0), 1)
        END as days_supply
      FROM latest_inventory inv
      LEFT JOIN sales_velocity sv ON inv.sku_number = sv.sku_id AND inv.store_number = sv.store_id
      WHERE (CASE 
          WHEN COALESCE(sv.units_sold_30d, 0) = 0 THEN 999
          ELSE inv.current_on_hand / (sv.units_sold_30d / 30.0)
        END) >= @days_supply_threshold
      ORDER BY inv.retail_value DESC
      LIMIT @limit

  # Return analysis

  # Store comparison - Item level side-by-side analysis
  get_comparison_analysis:
    kind: bigquery-sql
    source: bq-warehouse
    description: Compare top selling items between two stores with side-by-side metrics
    parameters:
      - name: store1_id
        type: integer
        description: First store ID
        default: 64
      - name: store2_id
        type: integer
        description: Second store ID
        default: 65
      - name: days_back
        type: integer
        description: Number of days to analyze
        default: 42
      - name: shop_id
        type: integer
        description: Shop ID to filter (0 for all shops)
        default: 0
      - name: limit
        type: integer
        description: Number of items to compare
        default: 25
    statement: |
      WITH store1_sales AS (
        SELECT 
          fs.sku_id,
          MAX(skus.as400_data.sku_description) as product_name,
          MAX(skus.as400_data.style) as style,
          MAX(skus.as400_data.vendor_name1) as vendor,
          MAX(skus.as400_data.specialty_shop_description) as shop_name,
          SUM(fs.quantity) as store1_units,
          SUM(fs.price_extended) as store1_revenue,
          ROUND(AVG(fs.price_extended / NULLIF(fs.quantity, 0)), 2) as store1_avg_price,
          ROUND(SAFE_DIVIDE(SUM(fs.price_extended) - SUM(fs.cogs_extended), SUM(fs.price_extended)) * 100, 1) as store1_margin_pct,
          RANK() OVER (ORDER BY SUM(fs.price_extended) DESC) as store1_rank
        FROM `sis-data-marts.warehouse.fct_sales` fs
        LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id
        WHERE fs.store_id = @store1_id
          AND DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL @days_back DAY)
          AND (@shop_id = 0 OR skus.specialty_shop = @shop_id)
        GROUP BY fs.sku_id
      ),
      store2_sales AS (
        SELECT 
          fs.sku_id,
          SUM(fs.quantity) as store2_units,
          SUM(fs.price_extended) as store2_revenue,
          ROUND(AVG(fs.price_extended / NULLIF(fs.quantity, 0)), 2) as store2_avg_price,
          ROUND(SAFE_DIVIDE(SUM(fs.price_extended) - SUM(fs.cogs_extended), SUM(fs.price_extended)) * 100, 1) as store2_margin_pct,
          RANK() OVER (ORDER BY SUM(fs.price_extended) DESC) as store2_rank
        FROM `sis-data-marts.warehouse.fct_sales` fs
        LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id
        WHERE fs.store_id = @store2_id
          AND DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL @days_back DAY)
          AND (@shop_id = 0 OR skus.specialty_shop = @shop_id)
        GROUP BY fs.sku_id
      ),
      combined_sales AS (
        SELECT 
          COALESCE(s1.sku_id, s2.sku_id) as sku_id,
          COALESCE(s1.product_name, 'Not sold in Store 1') as product_name,
          COALESCE(s1.style, '') as style,
          COALESCE(s1.vendor, '') as vendor,
          COALESCE(s1.shop_name, '') as shop_name,
          -- Store 1 metrics
          COALESCE(s1.store1_units, 0) as store1_units,
          COALESCE(s1.store1_revenue, 0) as store1_revenue,
          COALESCE(s1.store1_avg_price, 0) as store1_avg_price,
          COALESCE(s1.store1_margin_pct, 0) as store1_margin_pct,
          COALESCE(s1.store1_rank, 999) as store1_rank,
          -- Store 2 metrics
          COALESCE(s2.store2_units, 0) as store2_units,
          COALESCE(s2.store2_revenue, 0) as store2_revenue,
          COALESCE(s2.store2_avg_price, 0) as store2_avg_price,
          COALESCE(s2.store2_margin_pct, 0) as store2_margin_pct,
          COALESCE(s2.store2_rank, 999) as store2_rank,
          -- Comparison metrics
          COALESCE(s1.store1_revenue, 0) + COALESCE(s2.store2_revenue, 0) as combined_revenue
        FROM store1_sales s1
        FULL OUTER JOIN store2_sales s2 ON s1.sku_id = s2.sku_id
      )
      SELECT 
        sku_id,
        product_name,
        style,
        vendor,
        shop_name,
        -- Store 1 columns
        store1_rank as Rank_Store1,
        store1_units as Units_Store1,
        store1_revenue as Revenue_Store1,
        store1_avg_price as AvgPrice_Store1,
        store1_margin_pct as Margin_Store1,
        -- Store 2 columns
        store2_rank as Rank_Store2,
        store2_units as Units_Store2, 
        store2_revenue as Revenue_Store2,
        store2_avg_price as AvgPrice_Store2,
        store2_margin_pct as Margin_Store2,
        -- Differences
        store1_units - store2_units as Units_Diff,
        store1_revenue - store2_revenue as Revenue_Diff,
        store1_rank - store2_rank as Rank_Diff
      FROM combined_sales
      WHERE store1_rank <= @limit OR store2_rank <= @limit
      ORDER BY combined_revenue DESC
      LIMIT @limit

toolsets:
  retail_analytics:
    - get_top_selling_items
    - get_inventory_status
    - get_out_of_stock_items
    - get_sales_trends
    - get_top_margin_items
    - get_overstock_items
    - get_comparison_analysis