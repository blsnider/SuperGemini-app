sources:
  bq-warehouse:
    kind: bigquery
    project: sis-data-marts
    location: us
  bq-datamarts:
    kind: bigquery
    project: sis-data-marts
    location: us
  bq-salesmart:
    kind: bigquery
    project: scheels-data-marts
    location: us
  bq-sandbox:
    kind: bigquery
    project: sis-sandbox-463113
    location: us
tools:
  get_top_selling_items:
    kind: bigquery-sql
    source: bq-salesmart
    description: Get top selling items with optional filters
    parameters:
    - name: store_id
      type: integer
      description: Store ID to filter (0 for all stores)
      default: 0
    - name: shop_id
      type: integer
      description: Shop ID to filter (0 for all shops)
      default: 0
    - name: year_filter
      type: integer
      description: Year to filter (0 for all years)
      default: 0
    - name: days_back
      type: integer
      description: Number of days to look back (0 for no time filter)
      default: 30
    - name: limit
      type: integer
      description: Number of items to return
      default: 9999
    statement: "SELECT \n  fs.sku_id,\n  MAX(skus.as400_data.sku_description) as product_name,\n\
      \  MAX(skus.as400_data.style) as style,\n  MAX(skus.as400_data.vendor_name1)\
      \ as vendor,\n  MAX(skus.as400_data.specialty_shop_description) as shop_name,\n\
      \  fs.store_id as store_id,\n  SUM(CASE \n    WHEN fs.price_extended < 0 THEN -ABS(fs.quantity)\n    ELSE fs.quantity\n  END) as total_units,\n  SUM(fs.price_extended)\
      \ as total_revenue,\n  SUM(fs.cogs_extended) as total_cost,\n  SUM(CASE \n    WHEN fs.price_extended < 0 THEN fs.price_extended - (-ABS(fs.cogs_extended))\n    ELSE fs.price_extended - fs.cogs_extended\n  END) as total_margin,\n  SAFE_DIVIDE(SUM(CASE \n    WHEN fs.price_extended < 0 THEN fs.price_extended - (-ABS(fs.cogs_extended))\n    ELSE fs.price_extended - fs.cogs_extended\n  END), SUM(fs.price_extended)) * 100 as margin_pct\nFROM\
      \ `scheels-data-marts.facts_sales.fct_sales` fs\nLEFT JOIN `scheels-data-marts.dim_scheels.dim_skus`\
      \ skus ON fs.sku_id = skus.dim_sku_id\nWHERE 1=1\n  AND (@store_id = 0 OR fs.store_id\
      \ = @store_id)\n  AND (@shop_id = 0 OR skus.specialty_shop = @shop_id)\n  AND\
      \ (@year_filter = 0 OR EXTRACT(YEAR FROM fs.transaction_datetime) = @year_filter)\n\
      \  AND (@days_back = 0 OR DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(),\
      \ INTERVAL CAST(@days_back AS INT64) DAY))\nGROUP BY fs.sku_id, fs.store_id\n\
      ORDER BY total_revenue DESC\nLIMIT @limit\n"
  get_top_selling_item_comparison:
    kind: bigquery-sql
    source: bq-warehouse
    description: Compare top selling items between two stores with rankings
    parameters:
    - name: store1_id
      type: integer
      description: First store ID for comparison
      default: 0
    - name: store2_id
      type: integer
      description: Second store ID for comparison
      default: 0
    - name: shop_id
      type: integer
      description: Shop ID to filter (0 for all shops)
      default: 0
    - name: days_back
      type: integer
      description: Number of days to look back
      default: 42
    - name: limit
      type: integer
      description: Number of items to return
      default: 50
    statement: "WITH store1_sales AS (\n  SELECT \n    fs.sku_id,\n    MAX(skus.as400_data.sku_description)\
      \ as product_name,\n    MAX(skus.as400_data.style) as style,\n    MAX(skus.as400_data.vendor_name1)\
      \ as vendor,\n    MAX(skus.as400_data.specialty_shop_description) as shop_name,\n\
      \    SUM(CASE \n      WHEN fs.price_extended < 0 THEN -ABS(fs.quantity)\n      ELSE fs.quantity\n    END) as store1_units,\n    SUM(fs.price_extended) as store1_revenue,\n\
      \    RANK() OVER (ORDER BY SUM(fs.price_extended) DESC) as store1_rank\n  FROM\
      \ `sis-data-marts.warehouse.fct_sales` fs\n  LEFT JOIN `sis-data-marts.warehouse.dim_skus`\
      \ skus ON fs.sku_id = skus.dim_sku_id\n  LEFT JOIN `sis-data-marts.warehouse.dim_stores`\
      \ st ON fs.store_id = st.dim_store_id\n  WHERE st.dim_store_id = @store1_id\n\
      \    AND DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL\
      \ CAST(@days_back AS INT64) DAY)\n    AND (@shop_id = 0 OR skus.specialty_shop\
      \ = @shop_id)\n  GROUP BY fs.sku_id\n),\nstore2_sales AS (\n  SELECT \n    fs.sku_id,\n\
      \    SUM(CASE \n      WHEN fs.price_extended < 0 THEN -ABS(fs.quantity)\n      ELSE fs.quantity\n    END) as store2_units,\n    SUM(fs.price_extended) as store2_revenue,\n\
      \    RANK() OVER (ORDER BY SUM(fs.price_extended) DESC) as store2_rank\n  FROM\
      \ `sis-data-marts.warehouse.fct_sales` fs\n  LEFT JOIN `sis-data-marts.warehouse.dim_skus`\
      \ skus ON fs.sku_id = skus.dim_sku_id\n  LEFT JOIN `sis-data-marts.warehouse.dim_stores`\
      \ st ON fs.store_id = st.dim_store_id\n  WHERE st.dim_store_id = @store2_id\n\
      \    AND DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL\
      \ CAST(@days_back AS INT64) DAY)\n    AND (@shop_id = 0 OR skus.specialty_shop\
      \ = @shop_id)\n  GROUP BY fs.sku_id\n),\ncombined AS (\n  SELECT \n    COALESCE(s1.sku_id,\
      \ s2.sku_id) as sku_id,\n    COALESCE(s1.product_name, 'Not sold in Store 1')\
      \ as product_name,\n    COALESCE(s1.style, '') as style,\n    COALESCE(s1.vendor,\
      \ '') as vendor,\n    COALESCE(s1.shop_name, '') as shop_name,\n    -- Store\
      \ 1 metrics\n    COALESCE(s1.store1_rank, 9999) as store1_rank,\n    COALESCE(s1.store1_units,\
      \ 0) as store1_units,\n    COALESCE(s1.store1_revenue, 0) as store1_revenue,\n\
      \    -- Store 2 metrics\n    COALESCE(s2.store2_rank, 9999) as store2_rank,\n\
      \    COALESCE(s2.store2_units, 0) as store2_units,\n    COALESCE(s2.store2_revenue,\
      \ 0) as store2_revenue,\n    -- Comparison metrics\n    COALESCE(s1.store1_rank,\
      \ 9999) - COALESCE(s2.store2_rank, 9999) as rank_difference,\n    COALESCE(s1.store1_revenue,\
      \ 0) + COALESCE(s2.store2_revenue, 0) as total_revenue\n  FROM store1_sales\
      \ s1\n  FULL OUTER JOIN store2_sales s2 ON s1.sku_id = s2.sku_id\n)\nSELECT\
      \ \n  sku_id,\n  product_name,\n  style,\n  vendor,\n  shop_name,\n  store1_rank,\n\
      \  store1_units,\n  store1_revenue,\n  store2_rank,\n  store2_units,\n  store2_revenue,\n\
      \  rank_difference,\n  CASE \n    WHEN store1_rank < store2_rank THEN 'Better\
      \ in Store 1'\n    WHEN store1_rank > store2_rank THEN 'Better in Store 2'\n\
      \    WHEN store1_rank = store2_rank THEN 'Same rank'\n    ELSE 'Only in one\
      \ store'\n  END as performance_comparison\nFROM combined\nWHERE store1_rank\
      \ <= @limit OR store2_rank <= @limit\nORDER BY total_revenue DESC\nLIMIT @limit\n"
  get_units_vs_dollars_comparison:
    kind: bigquery-sql
    source: bq-warehouse
    description: Compare top items by units sold vs revenue generated
    parameters:
    - name: store_id
      type: integer
      description: Store ID to filter (0 for all)
      default: 0
    - name: shop_id
      type: integer
      description: Shop ID to filter (0 for all)
      default: 0
    - name: days_back
      type: integer
      description: Number of days to analyze
      default: 42
    - name: limit
      type: integer
      description: Top N items to compare
      default: 50
    statement: "WITH item_metrics AS (\n  SELECT \n    fs.sku_id,\n    MAX(skus.as400_data.sku_description)\
      \ as product_name,\n    MAX(skus.as400_data.style) as style,\n    MAX(skus.as400_data.vendor_name1)\
      \ as vendor,\n    MAX(skus.as400_data.specialty_shop_description) as shop_name,\n\
      \    SUM(CASE \n      WHEN fs.price_extended < 0 THEN -ABS(fs.quantity)\n      ELSE fs.quantity\n    END) as total_units,\n    SUM(fs.price_extended) as total_revenue,\n\
      \    SAFE_DIVIDE(SUM(fs.price_extended), NULLIF(SUM(CASE \n      WHEN fs.price_extended < 0 THEN -ABS(fs.quantity)\n      ELSE fs.quantity\n    END), 0)) as avg_price,\n\
      \    SUM(CASE \n      WHEN fs.price_extended < 0 THEN fs.price_extended - (-ABS(fs.cogs_extended))\n      ELSE fs.price_extended - fs.cogs_extended\n    END) as total_margin,\n    RANK()\
      \ OVER (ORDER BY SUM(CASE \n      WHEN fs.price_extended < 0 THEN -ABS(fs.quantity)\n      ELSE fs.quantity\n    END) DESC) as unit_rank,\n    RANK() OVER (ORDER\
      \ BY SUM(fs.price_extended) DESC) as revenue_rank\n  FROM `sis-data-marts.warehouse.fct_sales`\
      \ fs\n  LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id\n\
      \  LEFT JOIN `sis-data-marts.warehouse.dim_stores` st ON fs.store_id = st.dim_store_id\n\
      \  WHERE DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL\
      \ CAST(@days_back AS INT64) DAY)\n    AND (@store_id = 0 OR st.dim_store_id\
      \ = @store_id)\n    AND (@shop_id = 0 OR skus.specialty_shop = @shop_id)\n \
      \ GROUP BY fs.sku_id, CASE WHEN @store_id != 0 THEN fs.store_id ELSE 0 END\n\
      )\nSELECT \n  sku_id,\n  product_name,\n  style,\n  vendor,\n  shop_name,\n\
      \  total_units,\n  total_revenue,\n  avg_price,\n  total_margin,\n  unit_rank,\n\
      \  revenue_rank,\n  ABS(unit_rank - revenue_rank) as rank_difference,\n  CASE\
      \ \n    WHEN unit_rank < revenue_rank THEN 'High Volume, Lower Price'\n    WHEN\
      \ unit_rank > revenue_rank THEN 'Low Volume, Higher Price'\n    ELSE 'Balanced'\n\
      \  END as item_profile\nFROM item_metrics\nWHERE unit_rank <= @limit OR revenue_rank\
      \ <= @limit\nORDER BY total_revenue DESC\n"
  get_shop_performance:
    kind: bigquery-sql
    source: bq-warehouse
    description: Analyze performance metrics by shop including margins and drivers
    parameters:
    - name: shop_id
      type: integer
      description: Specific shop to analyze (0 for all shops comparison)
      default: 0
    - name: store_id
      type: integer
      description: Store ID to filter (0 for all)
      default: 0
    - name: days_back
      type: integer
      description: Number of days to analyze
      default: 42
    - name: metric_focus
      type: string
      description: Focus on 'units', 'revenue', or 'margin'
      default: revenue
    statement: "WITH shop_metrics AS (\n  SELECT \n    skus.specialty_shop as shop_id,\n\
      \    MAX(skus.as400_data.specialty_shop_description) as shop_name,\n    COUNT(DISTINCT\
      \ fs.sku_id) as unique_skus,\n    COUNT(DISTINCT fs.transaction_id) as transaction_count,\n\
      \    SUM(CASE \n      WHEN fs.price_extended < 0 THEN -ABS(fs.quantity)\n      ELSE fs.quantity\n    END) as total_units,\n    SUM(fs.price_extended) as total_revenue,\n\
      \    SUM(fs.cogs_extended) as total_cost,\n    SUM(CASE \n      WHEN fs.price_extended < 0 THEN fs.price_extended - (-ABS(fs.cogs_extended))\n      ELSE fs.price_extended - fs.cogs_extended\n    END) as total_margin,\n    SAFE_DIVIDE(SUM(CASE \n      WHEN fs.price_extended < 0 THEN fs.price_extended - (-ABS(fs.cogs_extended))\n      ELSE fs.price_extended - fs.cogs_extended\n    END), SUM(fs.price_extended)) * 100 as margin_pct,\n    SAFE_DIVIDE(SUM(fs.price_extended),\
      \ COUNT(DISTINCT fs.transaction_id)) as avg_transaction_value,\n    SAFE_DIVIDE(SUM(CASE \n      WHEN fs.price_extended < 0 THEN -ABS(fs.quantity)\n      ELSE fs.quantity\n    END),\
      \ COUNT(DISTINCT fs.transaction_id)) as avg_units_per_transaction\n  FROM `sis-data-marts.warehouse.fct_sales`\
      \ fs\n  LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id\n\
      \  LEFT JOIN `sis-data-marts.warehouse.dim_stores` st ON fs.store_id = st.dim_store_id\n\
      \  WHERE DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL\
      \ CAST(@days_back AS INT64) DAY)\n    AND (@shop_id = 0 OR skus.specialty_shop\
      \ = @shop_id)\n    AND (@store_id = 0 OR fs.store_id = @store_id)\n  GROUP BY\
      \ skus.specialty_shop\n),\nshop_rankings AS (\n  SELECT \n    *,\n    RANK()\
      \ OVER (ORDER BY total_units DESC) as unit_rank,\n    RANK() OVER (ORDER BY\
      \ total_revenue DESC) as revenue_rank,\n    RANK() OVER (ORDER BY margin_pct\
      \ DESC) as margin_rank,\n    RANK() OVER (ORDER BY total_margin DESC) as margin_dollar_rank\n\
      \  FROM shop_metrics\n)\nSELECT * FROM shop_rankings\nORDER BY \n  CASE \n \
      \   WHEN @metric_focus = 'units' THEN unit_rank\n    WHEN @metric_focus = 'revenue'\
      \ THEN revenue_rank\n    WHEN @metric_focus = 'margin' THEN margin_rank\n  \
      \  ELSE revenue_rank\n  END\n"
  get_1Y_out_of_stock_items:
    kind: bigquery-sql
    source: bq-datamarts
    description: Get 1Y rated items that are out of stock with recent sales
    parameters:
    - name: store_id
      type: integer
      description: Store number to filter (0 for all)
      default: 0
    - name: shop_id
      type: integer
      description: Shop ID to filter (0 for all shops)
      default: 0
    - name: min_sales_30d
      type: integer
      description: Minimum sales in last 30 days
      default: 1
    - name: limit
      type: integer
      description: Number of items to return
      default: 9999
    statement: "WITH out_of_stock AS (\n  SELECT \n    inv.sku_number,\n    inv.store_number,\n\
      \    inv.oh_units\n  FROM `sis-data-marts.data_marts.mart_current_on_hand` inv\n\
      \  LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON inv.sku_number = skus.dim_sku_id\n\
      \  WHERE \n inv.oh_units = 0\n  AND skus.as400_data.rate1 = '1-Y5'\n  AND (@store_id\
      \ = 0 OR inv.store_number = @store_id)\n  AND (@shop_id = 0 OR skus.specialty_shop\
      \ = @shop_id OR skus.specialty_shop IS NULL)\n),\nrecent_sales AS (\n  SELECT\
      \ \n    fs.sku_id,\n    fs.store_id,\n    SUM(CASE \n      WHEN fs.price_extended < 0 THEN -ABS(fs.quantity)\n      ELSE fs.quantity\n    END) as units_sold_30d,\n\
      \    SUM(fs.price_extended) as revenue_30d\n  FROM `sis-data-marts.warehouse.fct_sales`\
      \ fs\n  LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id\n\
      \  WHERE DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL\
      \ 30 DAY)\n    AND (@shop_id = 0 OR skus.specialty_shop = @shop_id)\n  GROUP\
      \ BY fs.sku_id, fs.store_id\n  HAVING SUM(CASE \n      WHEN fs.price_extended < 0 THEN -ABS(fs.quantity)\n      ELSE fs.quantity\n    END) >= @min_sales_30d\n)\n\
      SELECT \n  oos.sku_number,\n  oos.store_number,\n  rs.units_sold_30d,\n  rs.revenue_30d,\n\
      \  ROUND(rs.units_sold_30d / 30.0, 1) as daily_velocity\nFROM out_of_stock oos\n\
      INNER JOIN recent_sales rs ON oos.sku_number = rs.sku_id AND oos.store_number\
      \ = rs.store_id\nORDER BY rs.revenue_30d DESC\nLIMIT @limit\n"
  get_sales_trends:
    kind: bigquery-sql
    source: bq-warehouse
    description: Get sales trends over time
    parameters:
    - name: days_back
      type: integer
      description: Number of days to look back
      default: 42
    - name: store_id
      type: integer
      description: Store ID filter (0 for all)
      default: 0
    - name: shop_id
      type: integer
      description: Shop ID filter (0 for all)
      default: 0
    statement: "SELECT \n  DATE(fs.transaction_datetime) as sale_date,\n  COUNT(DISTINCT\
      \ fs.transaction_id) as transaction_count,\n  SUM(CASE \n    WHEN fs.price_extended < 0 THEN -ABS(fs.quantity)\n    ELSE fs.quantity\n  END) as total_units,\n\
      \  SUM(fs.price_extended) as total_revenue,\n  SUM(fs.cogs_extended) as total_cost,\n\
      \  ROUND(SUM(CASE \n    WHEN fs.price_extended < 0 THEN fs.price_extended - (-ABS(fs.cogs_extended))\n    ELSE fs.price_extended - fs.cogs_extended\n  END), 2) as total_margin,\n\
      \  ROUND(SAFE_DIVIDE(SUM(CASE \n    WHEN fs.price_extended < 0 THEN fs.price_extended - (-ABS(fs.cogs_extended))\n    ELSE fs.price_extended - fs.cogs_extended\n  END), SUM(fs.price_extended))\
      \ * 100, 1) as margin_pct\nFROM `sis-data-marts.warehouse.fct_sales` fs\nLEFT\
      \ JOIN `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id\n\
      LEFT JOIN `sis-data-marts.warehouse.dim_stores` st ON fs.store_id = st.dim_store_id\n\
      WHERE DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL CAST(@days_back\
      \ AS INT64) DAY)\n  AND (@store_id = 0 OR fs.store_id = @store_id)\n  AND (@shop_id\
      \ = 0 OR skus.specialty_shop = @shop_id)\nGROUP BY DATE(fs.transaction_datetime)\n\
      ORDER BY sale_date DESC\n"
  get_sell_through_rates:
    kind: bigquery-sql
    source: bq-datamarts
    description: Calculate sell-through rates by units and dollars
    parameters:
    - name: store_id
      type: integer
      description: Store ID to filter (0 for all)
      default: 0
    - name: shop_id
      type: integer
      description: Shop ID to filter (0 for all)
      default: 0
    - name: days_period
      type: integer
      description: Period for sell-through calculation
      default: 30
    - name: min_beginning_inventory
      type: integer
      description: Minimum beginning inventory to include
      default: 10
    - name: snapshot_date
      type: string
      description: Ending date for inventory snapshot (YYYY-MM-DD format)
      default: ''
    statement: "WITH beginning_inventory AS (\n  SELECT \n    inv.sku_number,\n  \
      \  inv.store_number,\n    inv.oh_units as beginning_units,\n    inv.retail_extension\
      \ as beginning_retail,\n    inv.product_details.sku_description as product_name,\n\
      \    inv.product_details.style as style,\n    COALESCE(skus.specialty_shop,\
      \ 0) as shop_id,\n    COALESCE(skus.as400_data.specialty_shop_description, '')\
      \ as shop_name\n  FROM `sis-data-marts.data_marts.mart_inventory_snapshots`\
      \ inv\n  LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON inv.sku_number\
      \ = skus.dim_sku_id\n  WHERE DATE(inv.snapshot_date) = DATE_SUB(\n    CASE \n\
      \      WHEN @snapshot_date = '' THEN CURRENT_DATE()\n      ELSE DATE(@snapshot_date)\n\
      \    END, INTERVAL CAST(@days_period AS INT64) DAY)\n    AND inv.oh_units >=\
      \ @min_beginning_inventory\n    AND (@store_id = 0 OR inv.store_number = @store_id)\n\
      \    AND (@shop_id = 0 OR skus.specialty_shop = @shop_id OR skus.specialty_shop\
      \ IS NULL)\n),\nperiod_sales AS (\n  SELECT \n    fs.sku_id,\n    fs.store_id,\n\
      \    SUM(CASE \n      WHEN fs.price_extended < 0 THEN -ABS(fs.quantity)\n      ELSE fs.quantity\n    END) as units_sold,\n    SUM(fs.price_extended) as revenue_sold\n\
      \  FROM `sis-data-marts.warehouse.fct_sales` fs\n  WHERE DATE(fs.transaction_datetime)\
      \ >= DATE_SUB(CURRENT_DATE(), INTERVAL CAST(@days_period AS INT64) DAY)\n  GROUP\
      \ BY fs.sku_id, fs.store_id\n),\ncurrent_inventory AS (\n  SELECT \n    inv.sku_number,\n\
      \    inv.store_number,\n    inv.oh_units as ending_units,\n    inv.retail_extension\
      \ as ending_retail\n  FROM `sis-data-marts.data_marts.mart_current_on_hand`\
      \ inv\n)\nSELECT \n  bi.sku_number,\n  bi.store_number,\n  bi.product_name,\n\
      \  bi.style,\n  bi.shop_name,\n  bi.beginning_units,\n  COALESCE(ps.units_sold,\
      \ 0) as units_sold,\n  COALESCE(ci.ending_units, 0) as ending_units,\n  bi.beginning_retail,\n\
      \  COALESCE(ps.revenue_sold, 0) as revenue_sold,\n  COALESCE(ci.ending_retail,\
      \ 0) as ending_retail,\n  SAFE_DIVIDE(COALESCE(ps.units_sold, 0), bi.beginning_units)\
      \ * 100 as unit_sell_through_pct,\n  SAFE_DIVIDE(COALESCE(ps.revenue_sold, 0),\
      \ bi.beginning_retail) * 100 as dollar_sell_through_pct,\n  CASE \n    WHEN\
      \ SAFE_DIVIDE(COALESCE(ps.units_sold, 0), bi.beginning_units) < 0.2 THEN 'Slow\
      \ Moving'\n    WHEN SAFE_DIVIDE(COALESCE(ps.units_sold, 0), bi.beginning_units)\
      \ > 0.8 THEN 'Fast Moving'\n    ELSE 'Normal'\n  END as velocity_category\n\
      FROM beginning_inventory bi\nLEFT JOIN period_sales ps ON bi.sku_number = ps.sku_id\
      \ AND bi.store_number = ps.store_id\nLEFT JOIN current_inventory ci ON bi.sku_number\
      \ = ci.sku_number AND bi.store_number = ci.store_number\nORDER BY unit_sell_through_pct\
      \ DESC\n"
  get_inventory_status_predictive:
  kind: bigquery-sql
  source: bq-datamarts
  description: Inventory status with 12-week forecast integration for proactive management
  parameters:
    - name: store_id
      type: integer
      description: Store number to filter (0 for all)
      default: 0
    - name: shop_id
      type: integer
      description: Shop ID to filter (0 for all)
      default: 0
    - name: min_priority_score
      type: integer
      description: Minimum priority score (0-100)
      default: 0
    - name: weeks_ahead
      type: integer
      description: Number of weeks to look ahead (max 12)
      default: 4
  statement: |
    WITH forecast_analysis AS (
      SELECT 
        rf.sku_number,
        rf.store_number,
        -- Current week forecast
        MAX(CASE 
          WHEN rf.scheels_end_week_date = DATE_TRUNC(DATE_ADD(CURRENT_DATE(), INTERVAL 7 DAY), WEEK(SUNDAY))
          THEN rf.week_forecasted_units 
        END) as forecast_week_1,
        -- Next 4 weeks cumulative
        SUM(CASE 
          WHEN rf.scheels_end_week_date <= DATE_ADD(CURRENT_DATE(), INTERVAL @weeks_ahead WEEK)
          THEN rf.week_forecasted_units 
          ELSE 0 
        END) as forecast_units_period,
        -- Full 12 week forecast
        SUM(rf.week_forecasted_units) as forecast_units_12w,
        -- Trend analysis
        STDDEV(rf.week_forecasted_units) as forecast_volatility,
        MAX(CASE 
          WHEN rf.scheels_end_week_date <= DATE_ADD(CURRENT_DATE(), INTERVAL 4 WEEK)
          THEN rf.week_forecasted_units 
        END) as peak_forecast_4w
      FROM `sis-data-marts.replenishment_forecasting.mart_replenishment_forecasting` rf
      WHERE rf.scheels_end_week_date > CURRENT_DATE()
        AND rf.scheels_end_week_date <= DATE_ADD(CURRENT_DATE(), INTERVAL 12 WEEK)
        AND (@store_id = 0 OR rf.store_number = @store_id)
      GROUP BY rf.sku_number, rf.store_number
    ),
    inventory_with_forecast AS (
      SELECT 
        im.*,
        fa.forecast_units_period,
        fa.forecast_units_12w,
        fa.peak_forecast_4w,
        -- Calculate weeks of supply based on forecast
        CASE 
          WHEN COALESCE(fa.forecast_units_period, 0) = 0 THEN 999
          ELSE ROUND(im.current_on_hand / (fa.forecast_units_period / @weeks_ahead), 1)
        END as weeks_of_supply_forecast,
        -- Stockout risk based on forecast
        CASE
          WHEN im.current_on_hand < COALESCE(fa.forecast_week_1, 0) THEN 'Immediate Risk'
          WHEN im.current_on_hand < COALESCE(fa.forecast_units_period, 0) THEN 'Near-term Risk'
          WHEN im.current_on_hand < COALESCE(fa.forecast_units_12w, 0) * 0.5 THEN 'Medium-term Risk'
          ELSE 'Low Risk'
        END as stockout_risk_forecast,
        -- Enhanced priority score with forecast
        CASE
          WHEN im.current_on_hand = 0 AND COALESCE(fa.forecast_week_1, 0) > 0 THEN 100
          WHEN im.current_on_hand < COALESCE(fa.forecast_week_1, 0) THEN 95
          WHEN im.current_on_hand < COALESCE(fa.forecast_units_period, 0) THEN 
            80 + (20 * (1 - im.current_on_hand / NULLIF(fa.forecast_units_period, 0)))
          ELSE im.priority_score -- Use original calculation
        END as priority_score_enhanced
      FROM inventory_metrics im
      LEFT JOIN forecast_analysis fa 
        ON im.sku_number = fa.sku_number 
        AND im.store_number = fa.store_number
    )
    SELECT * FROM inventory_with_forecast
    WHERE priority_score_enhanced >= @min_priority_score
    ORDER BY priority_score_enhanced DESC
  get_overstock_items_forecast_aware:
    kind: bigquery-sql
    source: bq-datamarts
    description: Enhanced overstock analysis incorporating 12-week forecast data for smarter decisions
    parameters:
    - name: store_id
      type: integer
      description: Store number to filter (0 for all)
      default: 0
    - name: shop_id
      type: integer
      description: Shop ID to filter (0 for all shops)
      default: 0
    - name: days_supply_threshold
      type: integer
      description: Minimum days supply to consider overstock
      default: 90
    - name: include_forecast
      type: integer
      description: Include forecast in days supply calculation (1=yes, 0=no)
      default: 1
    statement: |
    WITH forecast_data AS (
      SELECT 
        sku_number,
        store_number,
        SUM(week_forecasted_units) as units_forecast_12w,
        AVG(week_forecasted_units) as avg_weekly_forecast,
        MAX(scheels_end_week_date) as forecast_end_date
      FROM `sis-data-marts.replenishment_forecasting.mart_replenishment_forecasting`
      WHERE scheels_end_week_date > CURRENT_DATE()
        AND scheels_end_week_date <= DATE_ADD(CURRENT_DATE(), INTERVAL 12 WEEK)
        AND week_forecasted_units > 0
        AND (@store_id = 0 OR store_number = @store_id)
      GROUP BY sku_number, store_number
    ),
    latest_inventory AS (
      -- Your existing inventory query
    ),
    sales_velocity AS (
      -- Your existing sales velocity
    ),
    combined_demand AS (
      SELECT 
        inv.sku_number,
        inv.store_number,
        inv.current_on_hand,
        COALESCE(sv.units_sold_90d, 0) as units_sold_90d,
        COALESCE(fd.units_forecast_12w, 0) as units_forecast_12w,
        -- Use forecast if available, otherwise use historical
        CASE 
          WHEN @include_forecast = 1 AND COALESCE(fd.avg_weekly_forecast, 0) > 0 
            THEN fd.avg_weekly_forecast * 7  -- Convert to daily
          ELSE COALESCE(sv.units_sold_90d / 90.0, 0)
        END as daily_demand,
        CASE
          WHEN COALESCE(fd.avg_weekly_forecast, 0) > COALESCE(sv.units_sold_90d / 12.86, 0) * 1.5 
            THEN 'Forecast Spike Expected'
          WHEN COALESCE(fd.avg_weekly_forecast, 0) < COALESCE(sv.units_sold_90d / 12.86, 0) * 0.5 
            THEN 'Forecast Decline Expected'
          ELSE 'Stable Forecast'
        END as forecast_trend
      FROM latest_inventory inv
      LEFT JOIN sales_velocity sv ON inv.sku_number = sv.sku_id AND inv.store_number = sv.store_id
      LEFT JOIN forecast_data fd ON inv.sku_number = fd.sku_number AND inv.store_number = fd.store_number
    )
    SELECT 
      *,
      CASE 
        WHEN daily_demand = 0 THEN 999
        ELSE ROUND(current_on_hand / daily_demand, 1)
      END as days_supply_with_forecast,
      CASE
        WHEN daily_demand = 0 THEN 999
        WHEN current_on_hand / daily_demand >= @days_supply_threshold 
          AND forecast_trend != 'Forecast Spike Expected' THEN TRUE
        ELSE FALSE
      END as is_overstock
    FROM combined_demand
  get_comparison_analysis:
    kind: bigquery-sql
    source: bq-warehouse
    description: Compare top selling items between two stores with side-by-side metrics
    parameters:
    - name: store1_id
      type: integer
      description: First store ID
      default: 64
    - name: store2_id
      type: integer
      description: Second store ID
      default: 0
    - name: days_back
      type: integer
      description: Number of days to analyze
      default: 42
    - name: shop_id
      type: integer
      description: Shop ID to filter (0 for all shops)
      default: 0
    - name: limit
      type: integer
      description: Number of items to compare
      default: 25
    statement: "WITH store1_sales AS (\n  SELECT \n    fs.sku_id,\n    MAX(skus.as400_data.sku_description)\
      \ as product_name,\n    MAX(skus.as400_data.style) as style,\n    MAX(skus.as400_data.vendor_name1)\
      \ as vendor,\n    MAX(skus.as400_data.specialty_shop_description) as shop_name,\n\
      \    SUM(CASE \n      WHEN fs.price_extended < 0 THEN -ABS(fs.quantity)\n      ELSE fs.quantity\n    END) as store1_units,\n    SUM(fs.price_extended) as store1_revenue,\n\
      \    ROUND(AVG(fs.price_extended / NULLIF(CASE \n      WHEN fs.price_extended < 0 THEN -ABS(fs.quantity)\n      ELSE fs.quantity\n    END, 0)), 2) as store1_avg_price,\n\
      \    ROUND(SAFE_DIVIDE(SUM(CASE \n      WHEN fs.price_extended < 0 THEN fs.price_extended - (-ABS(fs.cogs_extended))\n      ELSE fs.price_extended - fs.cogs_extended\n    END), SUM(fs.price_extended))\
      \ * 100, 1) as store1_margin_pct,\n    RANK() OVER (ORDER BY SUM(fs.price_extended)\
      \ DESC) as store1_rank\n  FROM `sis-data-marts.warehouse.fct_sales` fs\n  LEFT\
      \ JOIN `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id\n\
      \  WHERE fs.store_id = @store1_id\n    AND DATE(fs.transaction_datetime) >=\
      \ DATE_SUB(CURRENT_DATE(), INTERVAL CAST(@days_back AS INT64) DAY)\n    AND\
      \ (@shop_id = 0 OR skus.specialty_shop = @shop_id)\n  GROUP BY fs.sku_id\n),\n\
      store2_sales AS (\n  SELECT \n    fs.sku_id,\n    SUM(CASE \n      WHEN fs.price_extended < 0 THEN -ABS(fs.quantity)\n      ELSE fs.quantity\n    END) as store2_units,\n\
      \    SUM(fs.price_extended) as store2_revenue,\n    ROUND(AVG(fs.price_extended\
      \ / NULLIF(CASE \n      WHEN fs.price_extended < 0 THEN -ABS(fs.quantity)\n      ELSE fs.quantity\n    END, 0)), 2) as store2_avg_price,\n    ROUND(SAFE_DIVIDE(SUM(CASE \n      WHEN fs.price_extended < 0 THEN fs.price_extended - (-ABS(fs.cogs_extended))\n      ELSE fs.price_extended - fs.cogs_extended\n    END), SUM(fs.price_extended)) * 100, 1) as store2_margin_pct,\n\
      \    RANK() OVER (ORDER BY SUM(fs.price_extended) DESC) as store2_rank\n  FROM\
      \ `sis-data-marts.warehouse.fct_sales` fs\n  LEFT JOIN `sis-data-marts.warehouse.dim_skus`\
      \ skus ON fs.sku_id = skus.dim_sku_id\n  WHERE fs.store_id = @store2_id\n  \
      \  AND DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL CAST(@days_back\
      \ AS INT64) DAY)\n    AND (@shop_id = 0 OR skus.specialty_shop = @shop_id)\n\
      \  GROUP BY fs.sku_id\n),\ncombined_sales AS (\n  SELECT \n    COALESCE(s1.sku_id,\
      \ s2.sku_id) as sku_id,\n    COALESCE(s1.product_name, 'Not sold in Store 1')\
      \ as product_name,\n    COALESCE(s1.style, '') as style,\n    COALESCE(s1.vendor,\
      \ '') as vendor,\n    COALESCE(s1.shop_name, '') as shop_name,\n    -- Store\
      \ 1 metrics\n    COALESCE(s1.store1_units, 0) as store1_units,\n    COALESCE(s1.store1_revenue,\
      \ 0) as store1_revenue,\n    COALESCE(s1.store1_avg_price, 0) as store1_avg_price,\n\
      \    COALESCE(s1.store1_margin_pct, 0) as store1_margin_pct,\n    COALESCE(s1.store1_rank,\
      \ 999) as store1_rank,\n    -- Store 2 metrics\n    COALESCE(s2.store2_units,\
      \ 0) as store2_units,\n    COALESCE(s2.store2_revenue, 0) as store2_revenue,\n\
      \    COALESCE(s2.store2_avg_price, 0) as store2_avg_price,\n    COALESCE(s2.store2_margin_pct,\
      \ 0) as store2_margin_pct,\n    COALESCE(s2.store2_rank, 999) as store2_rank,\n\
      \    -- Comparison metrics\n    COALESCE(s1.store1_revenue, 0) + COALESCE(s2.store2_revenue,\
      \ 0) as combined_revenue\n  FROM store1_sales s1\n  FULL OUTER JOIN store2_sales\
      \ s2 ON s1.sku_id = s2.sku_id\n)\nSELECT \n  sku_id,\n  product_name,\n  style,\n\
      \  vendor,\n  shop_name,\n  -- Store 1 columns\n  store1_rank as Rank_Store1,\n\
      \  store1_units as Units_Store1,\n  store1_revenue as Revenue_Store1,\n  store1_avg_price\
      \ as AvgPrice_Store1,\n  store1_margin_pct as Margin_Store1,\n  -- Store 2 columns\n\
      \  store2_rank as Rank_Store2,\n  store2_units as Units_Store2, \n  store2_revenue\
      \ as Revenue_Store2,\n  store2_avg_price as AvgPrice_Store2,\n  store2_margin_pct\
      \ as Margin_Store2,\n  -- Differences\n  store1_units - store2_units as Units_Diff,\n\
      \  store1_revenue - store2_revenue as Revenue_Diff,\n  store1_rank - store2_rank\
      \ as Rank_Diff\nFROM combined_sales\nWHERE store1_rank <= @limit OR store2_rank\
      \ <= @limit\nORDER BY combined_revenue DESC\nLIMIT @limit\n"
  get_advanced_stockout_analysis:
    kind: bigquery-sql
    source: bq-datamarts
    description: Tracks stockouts and lost sales opportunities; flags high-risk items
    parameters:
    - name: store_id
      type: integer
      description: Store ID to filter
      default: 0
    - name: shop_id
      type: integer
      description: Shop ID to filter
      default: 0
    - name: min_stockouts
      type: integer
      description: Minimum number of stockout incidents
      default: 1
    - name: days_back
      type: integer
      description: Number of days to analyze
      default: 60
    - name: limit
      type: integer
      description: Number of items to return
      default: 9999
    statement: "WITH current_stockouts AS (\n  SELECT \n    oh.sku_number,\n    oh.store_number,\n\
      \    COALESCE(skus.as400_data.sku_description, 'Unknown') as product_name,\n\
      \    COALESCE(skus.as400_data.style, '') as style,\n    COALESCE(skus.as400_data.vendor_name1,\
      \ '') as vendor,\n    COALESCE(skus.specialty_shop, 0) as shop_id,\n    oh.oh_units\
      \ as current_on_hand\n  FROM `sis-data-marts.data_marts.mart_current_on_hand`\
      \ oh\n  LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON oh.sku_number\
      \ = skus.dim_sku_id\n  WHERE oh.oh_units = 0\n    AND (@store_id = 0 OR oh.store_number\
      \ = @store_id)\n    AND (@shop_id = 0 OR skus.specialty_shop = @shop_id OR skus.specialty_shop\
      \ IS NULL)\n),\nhistorical_sales AS (\n  SELECT \n    fs.sku_id,\n    fs.store_id,\n\
      \    AVG(CASE \n      WHEN fs.price_extended < 0 THEN -ABS(fs.quantity)\n      ELSE fs.quantity\n    END) as avg_daily_sales,\n    SUM(CASE \n      WHEN fs.price_extended < 0 THEN -ABS(fs.quantity)\n      ELSE fs.quantity\n    END) as total_units_sold,\n\
      \    AVG(fs.price_extended / NULLIF(CASE \n      WHEN fs.price_extended < 0 THEN -ABS(fs.quantity)\n      ELSE fs.quantity\n    END, 0)) as avg_selling_price,\n\
      \    COUNT(DISTINCT DATE(fs.transaction_datetime)) as days_with_sales\n  FROM\
      \ `sis-data-marts.warehouse.fct_sales` fs\n  WHERE DATE(fs.transaction_datetime)\
      \ >= DATE_SUB(CURRENT_DATE(), INTERVAL CAST(@days_back AS INT64) DAY)\n    AND\
      \ DATE(fs.transaction_datetime) < DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY)\n\
      \  GROUP BY fs.sku_id, fs.store_id\n),\nrecent_activity AS (\n  SELECT \n  \
      \  fs.sku_id,\n    fs.store_id,\n    MAX(DATE(fs.transaction_datetime)) as last_sale_date,\n\
      \    DATE_DIFF(CURRENT_DATE(), MAX(DATE(fs.transaction_datetime)), DAY) as days_since_last_sale\n\
      \  FROM `sis-data-marts.warehouse.fct_sales` fs\n  GROUP BY fs.sku_id, fs.store_id\n\
      )\nSELECT \n  cs.sku_number,\n  cs.product_name,\n  cs.style,\n  cs.vendor,\n\
      \  cs.store_number,\n  ra.days_since_last_sale,\n  ROUND(hs.avg_daily_sales,\
      \ 2) as avg_daily_demand,\n  hs.total_units_sold as units_sold_period,\n  ROUND(hs.avg_selling_price,\
      \ 2) as avg_price,\n  ROUND(hs.avg_daily_sales * hs.avg_selling_price * ra.days_since_last_sale,\
      \ 2) as estimated_lost_revenue,\n  ROUND((ra.days_since_last_sale / CAST(@days_back\
      \ AS FLOAT64)) * 100, 1) as stockout_rate_pct,\n  CASE\n    WHEN ra.days_since_last_sale\
      \ >= 14 THEN 'Critical'\n    WHEN ra.days_since_last_sale >= 7 THEN 'High'\n\
      \    WHEN ra.days_since_last_sale >= 3 THEN 'Medium'\n    ELSE 'Low'\n  END\
      \ as stockout_severity\nFROM current_stockouts cs\nLEFT JOIN historical_sales\
      \ hs ON cs.sku_number = hs.sku_id AND cs.store_number = hs.store_id\nLEFT JOIN\
      \ recent_activity ra ON cs.sku_number = ra.sku_id AND cs.store_number = ra.store_id\n\
      WHERE hs.avg_daily_sales > 0\n  AND ra.days_since_last_sale >= @min_stockouts\n\
      ORDER BY estimated_lost_revenue DESC\nLIMIT @limit\n"
  get_advanced_gmroi_performance:
    kind: bigquery-sql
    source: bq-warehouse
    description: Evaluates gross margin return on inventory investment
    parameters:
    - name: store_id
      type: integer
      description: Store ID to filter (0 for all)
      default: 0
    - name: shop_id
      type: integer
      description: Shop ID to filter (0 for all)
      default: 0
    - name: days_back
      type: integer
      description: Number of days to analyze
      default: 90
    - name: min_gmroi
      type: float
      description: Minimum GMROI threshold
      default: 0.0
    - name: limit
      type: integer
      description: Number of items to return
      default: 9999
    statement: "WITH sales_metrics AS (\n  SELECT \n    fs.sku_id,\n    fs.store_id,\n\
      \    MAX(skus.as400_data.sku_description) as product_name,\n    MAX(skus.as400_data.style)\
      \ as style,\n    MAX(skus.as400_data.vendor_name1) as vendor,\n    MAX(skus.as400_data.specialty_shop_description)\
      \ as shop_name,\n    SUM(CASE \n      WHEN fs.price_extended < 0 THEN -ABS(fs.quantity)\n      ELSE fs.quantity\n    END) as units_sold,\n    SUM(fs.price_extended)\
      \ as total_revenue,\n    SUM(fs.cogs_extended) as total_cogs,\n    SUM(CASE \n      WHEN fs.price_extended < 0 THEN fs.price_extended - (-ABS(fs.cogs_extended))\n      ELSE fs.price_extended - fs.cogs_extended\n    END) as gross_margin,\n    COUNT(DISTINCT fs.transaction_id)\
      \ as transaction_count\n  FROM `sis-data-marts.warehouse.fct_sales` fs\n  LEFT\
      \ JOIN `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id\n\
      \  WHERE DATE(fs.transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL\
      \ CAST(@days_back AS INT64) DAY)\n    AND (@store_id = 0 OR fs.store_id = @store_id)\n\
      \    AND (@shop_id = 0 OR skus.specialty_shop = @shop_id)\n  GROUP BY fs.sku_id,\
      \ fs.store_id\n),\ninventory_investment AS (\n  SELECT \n    sku_number,\n \
      \   store_number,\n    AVG(oh_units) as avg_inventory_units,\n    AVG(cost_extension)\
      \ as avg_inventory_cost\n  FROM `sis-data-marts.data_marts.mart_current_on_hand`\n\
      \  WHERE (@store_id = 0 OR store_number = @store_id)\n  GROUP BY sku_number,\
      \ store_number\n)\nSELECT \n  sm.sku_id,\n  sm.product_name,\n  sm.style,\n\
      \  sm.vendor,\n  sm.shop_name,\n  sm.units_sold,\n  ROUND(sm.total_revenue,\
      \ 2) as revenue,\n  ROUND(sm.gross_margin, 2) as gross_margin,\n  ROUND(sm.gross_margin\
      \ / NULLIF(sm.total_revenue, 0) * 100, 1) as margin_pct,\n  ROUND(ii.avg_inventory_cost,\
      \ 2) as avg_inventory_investment,\n  CASE \n    WHEN ii.avg_inventory_cost >\
      \ 0 \n    THEN ROUND((sm.gross_margin * (365.0 / CAST(@days_back AS FLOAT64)))\
      \ / ii.avg_inventory_cost, 2)\n    ELSE NULL\n  END as gmroi,\n  ROUND(sm.total_revenue\
      \ / NULLIF(ii.avg_inventory_cost, 0), 2) as inventory_turns,\n  CASE\n    WHEN\
      \ (sm.gross_margin * (365.0 / CAST(@days_back AS FLOAT64))) / NULLIF(ii.avg_inventory_cost,\
      \ 0) >= 3 THEN 'Excellent'\n    WHEN (sm.gross_margin * (365.0 / CAST(@days_back\
      \ AS FLOAT64))) / NULLIF(ii.avg_inventory_cost, 0) >= 2 THEN 'Good'\n    WHEN\
      \ (sm.gross_margin * (365.0 / CAST(@days_back AS FLOAT64))) / NULLIF(ii.avg_inventory_cost,\
      \ 0) >= 1 THEN 'Fair'\n    ELSE 'Poor'\n  END as gmroi_rating,\n  ROUND(sm.gross_margin\
      \ / NULLIF(sm.units_sold, 0), 2) as margin_per_unit\nFROM sales_metrics sm\n\
      INNER JOIN inventory_investment ii ON sm.sku_id = ii.sku_number AND sm.store_id\
      \ = ii.store_number\nWHERE ii.avg_inventory_cost > 0\n  AND (sm.gross_margin\
      \ * (365.0 / CAST(@days_back AS FLOAT64))) / ii.avg_inventory_cost >= CAST(@min_gmroi\
      \ AS FLOAT64)\nORDER BY gmroi DESC\nLIMIT @limit\n"
  
  get_otb_metrics:
    kind: bigquery-sql
    source: bq-sandbox
    description: Retrieve Open To Buy (OTB) metrics for shops and stores, including
      goals, ordered amounts, remaining budgets, received inventory, and percentages.
      Filter by shop, store, metric, or year.
    parameters:
    - name: shop_id
      type: string
      description: Shop ID to filter (empty/null for all)
      default: null
    - name: store_id
      type: string
      description: Store ID to filter (empty/null for all)
      default: null
    - name: metric_name
      type: string
      description: Specific metric name to filter (e.g., 'OTB Goal', empty/null for
        all)
      default: null
    - name: year
      type: integer
      description: Year to filter (0 for all years)
      default: 0
    statement: "SELECT \n  CAST(shop_id AS STRING) AS shop_id,\n  shop_name,\n  CAST(store_id\
      \ AS STRING) AS store_id,\n  store_name,\n  metric_name,\n  date_month,\n  value,\n\
      \  last_updated_timestamp\nFROM `sis-sandbox-463113.OTB.OTB_at_a_glance`\nWHERE\
      \ 1=1\n  AND (COALESCE(@shop_id, '') = '' OR shop_id = @shop_id)\n  AND (COALESCE(@store_id,\
      \ '') = '' OR store_id = @store_id)\n  AND (COALESCE(@metric_name, '') = ''\
      \ OR metric_name = @metric_name)\n  AND (@year = 0 OR EXTRACT(YEAR FROM date_month)\
      \ = @year)\nORDER BY date_month DESC, shop_id, store_id, metric_name\n"
  get_sales_variance_analysis:
    kind: bigquery-sql
    source: bq-warehouse
    description: Compares sales metrics (units, revenue) to last year (LY) or prior
      periods, highlighting variances by shop/category/store. Flags anomalies for
      action.
    parameters:
    - name: store_id
      type: integer
      description: Store ID to filter (0 for all stores)
      default: 0
    - name: shop_id
      type: integer
      description: Shop ID to filter (0 for all shops)
      default: 0
    - name: period
      type: string
      description: Period type - weekly, monthly, or yoy
      default: weekly
    - name: days_back
      type: integer
      description: Number of days to look back
      default: 7
    - name: limit
      type: integer
      description: Number of results to return
      default: 50
    statement: "WITH ty_sales AS (\n  SELECT \n    skus.specialty_shop AS shop_id,\n\
      \    MAX(skus.as400_data.specialty_shop_description) as shop_name,\n    SUM(CASE \n      WHEN fs.price_extended < 0 THEN -ABS(fs.quantity)\n      ELSE fs.quantity\n    END)\
      \ AS total_units_ty,\n    SUM(fs.price_extended) AS total_revenue_ty\n  FROM\
      \ `sis-data-marts.warehouse.fct_sales` fs\n  LEFT JOIN `sis-data-marts.warehouse.dim_skus`\
      \ skus ON fs.sku_id = skus.dim_sku_id\n  WHERE DATE(fs.transaction_datetime)\
      \ >= DATE_SUB(CURRENT_DATE(), INTERVAL @days_back DAY)\n    AND (@store_id =\
      \ 0 OR fs.store_id = @store_id)\n    AND (@shop_id = 0 OR skus.specialty_shop\
      \ = @shop_id)\n  GROUP BY shop_id\n),\nly_sales AS (\n  SELECT \n    skus.specialty_shop\
      \ AS shop_id,\n    MAX(skus.as400_data.specialty_shop_description) as shop_name,\n\
      \    SUM(CASE \n      WHEN fs.price_extended < 0 THEN -ABS(fs.quantity)\n      ELSE fs.quantity\n    END) AS total_units_ly,\n    SUM(fs.price_extended) AS total_revenue_ly\n\
      \  FROM `sis-data-marts.warehouse.fct_sales` fs\n  LEFT JOIN `sis-data-marts.warehouse.dim_skus`\
      \ skus ON fs.sku_id = skus.dim_sku_id\n  WHERE DATE(fs.transaction_datetime)\
      \ BETWEEN DATE_SUB(DATE_SUB(CURRENT_DATE(), INTERVAL 1 YEAR), INTERVAL @days_back\
      \ DAY) \n    AND DATE_SUB(CURRENT_DATE(), INTERVAL 1 YEAR)\n    AND (@store_id\
      \ = 0 OR fs.store_id = @store_id)\n    AND (@shop_id = 0 OR skus.specialty_shop\
      \ = @shop_id)\n  GROUP BY shop_id\n)\nSELECT \n  COALESCE(ty.shop_id, ly.shop_id)\
      \ AS shop_id,\n  COALESCE(ty.shop_name, ly.shop_name) AS shop_name,\n  COALESCE(ty.total_revenue_ty,\
      \ 0) AS revenue_ty,\n  COALESCE(ly.total_revenue_ly, 0) AS revenue_ly,\n  COALESCE(ty.total_revenue_ty,\
      \ 0) - COALESCE(ly.total_revenue_ly, 0) AS dollar_var_ly,\n  SAFE_DIVIDE(COALESCE(ty.total_revenue_ty,\
      \ 0) - COALESCE(ly.total_revenue_ly, 0), COALESCE(ly.total_revenue_ly, 0)) *\
      \ 100 AS pct_var_ly,\n  COALESCE(ty.total_units_ty, 0) AS units_ty,\n  COALESCE(ly.total_units_ly,\
      \ 0) AS units_ly,\n  COALESCE(ty.total_units_ty, 0) - COALESCE(ly.total_units_ly,\
      \ 0) AS units_var_ly,\n  RANK() OVER (ORDER BY ABS(COALESCE(ty.total_revenue_ty,\
      \ 0) - COALESCE(ly.total_revenue_ly, 0)) DESC) AS variance_rank\nFROM ty_sales\
      \ ty\nFULL OUTER JOIN ly_sales ly ON ty.shop_id = ly.shop_id\nORDER BY variance_rank\n\
      LIMIT @limit\n"
  get_otb_aware_reorder_recommendations:
    kind: bigquery-sql
    source: bq-sandbox
    description: Generates reorder recommendations with OTB budget constraints, prioritizing critical items within available budget
    parameters:
    - name: store_id
      type: integer
      description: Store ID to filter (0 for all stores)
      default: 0
    - name: shop_id
      type: integer
      description: Shop ID to filter (0 for all shops)
      default: 0
    - name: min_priority_score
      type: integer
      description: Minimum priority score for items to consider (0-100)
      default: 70
    - name: days_coverage_target
      type: integer
      description: Target days of inventory coverage
      default: 30
    statement: "WITH otb_remaining AS (\n  SELECT \n    CAST(shop_id AS INT64) as shop_id,\n    shop_name,\n    CAST(store_id AS INT64) as store_id,\n    store_name,\n    value as otb_remaining\n  FROM `sis-sandbox-463113.OTB.OTB_at_a_glance`\n  WHERE metric_name = 'Monthly OTB remaining'\n    AND date_month = DATE_TRUNC(CURRENT_DATE(), MONTH)\n    AND (@store_id = 0 OR CAST(store_id AS INT64) = @store_id)\n    AND (@shop_id = 0 OR CAST(shop_id AS INT64) = @shop_id)\n),\ninventory_metrics AS (\n  SELECT \n    inv.sku_number,\n    inv.store_number,\n    COALESCE(skus.as400_data.sku_description, '') as product_name,\n    COALESCE(skus.as400_data.style, '') as style,\n    COALESCE(skus.as400_data.vendor_name1, '') as vendor,\n    inv.cost_extension / NULLIF(inv.oh_units, 0) as unit_cost,\n    inv.oh_units as current_on_hand,\n    inv.cost_extension as current_cost_value,\n    COALESCE(skus.specialty_shop, 0) as shop_id,\n    COALESCE(skus.as400_data.specialty_shop_description, '') as shop_name\n  FROM `sis-data-marts.data_marts.mart_current_on_hand` inv\n  LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON inv.sku_number = skus.dim_sku_id\n  WHERE 1=1\n    AND (@store_id = 0 OR inv.store_number = @store_id)\n    AND (@shop_id = 0 OR skus.specialty_shop = @shop_id OR skus.specialty_shop IS NULL)\n),\nsales_patterns AS (\n  SELECT \n    fs.sku_id,\n    fs.store_id,\n    SUM(CASE WHEN DATE(fs.sale_date) >= DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY) \n             THEN fs.daily_units ELSE 0 END) as units_7d,\n    SUM(CASE WHEN DATE(fs.sale_date) >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY) \n             THEN fs.daily_units ELSE 0 END) as units_30d\n  FROM (\n    SELECT \n      sku_id,\n      store_id,\n      DATE(transaction_datetime) as sale_date,\n      SUM(CASE \n        WHEN price_extended < 0 THEN -ABS(quantity)\n        ELSE quantity\n      END) as daily_units\n    FROM `sis-data-marts.warehouse.fct_sales`\n    WHERE DATE(transaction_datetime) >= DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)\n    GROUP BY sku_id, store_id, sale_date\n  ) fs\n  GROUP BY fs.sku_id, fs.store_id\n),\nreorder_needs AS (\n  SELECT \n    im.*,\n    COALESCE(sp.units_7d, 0) as units_sold_7d,\n    COALESCE(sp.units_30d, 0) as units_sold_30d,\n    CASE \n      WHEN COALESCE(sp.units_7d, 0) = 0 THEN 999\n      ELSE ROUND(im.current_on_hand / (sp.units_7d / 7.0), 1)\n    END as days_of_supply,\n    -- Calculate priority score\n    CASE\n      WHEN im.current_on_hand = 0 AND COALESCE(sp.units_7d, 0) > 0 THEN 100\n      WHEN im.current_on_hand > 0 AND im.current_on_hand / NULLIF(sp.units_7d / 7.0, 0) < 3 THEN \n        80 + (20 * (1 - im.current_on_hand / NULLIF(sp.units_7d / 7.0, 0) / 3))\n      WHEN im.current_on_hand / NULLIF(sp.units_7d / 7.0, 0) < 7 THEN \n        60 + (20 * (1 - (im.current_on_hand / NULLIF(sp.units_7d / 7.0, 0) - 3) / 4))\n      ELSE 0\n    END as priority_score,\n    -- Calculate reorder quantity\n    CASE\n      WHEN im.current_on_hand = 0 AND COALESCE(sp.units_7d, 0) > 0 THEN \n        CEIL(sp.units_30d / 30.0 * @days_coverage_target)\n      WHEN im.current_on_hand / NULLIF(sp.units_7d / 7.0, 0) < 7 THEN \n        CEIL(sp.units_30d / 30.0 * @days_coverage_target - im.current_on_hand)\n      ELSE 0\n    END as suggested_reorder_qty,\n    -- Calculate reorder cost\n    CASE\n      WHEN im.current_on_hand = 0 AND COALESCE(sp.units_7d, 0) > 0 THEN \n        CEIL(sp.units_30d / 30.0 * @days_coverage_target) * im.unit_cost\n      WHEN im.current_on_hand / NULLIF(sp.units_7d / 7.0, 0) < 7 THEN \n        CEIL(sp.units_30d / 30.0 * @days_coverage_target - im.current_on_hand) * im.unit_cost\n      ELSE 0\n    END as reorder_cost\n  FROM inventory_metrics im\n  LEFT JOIN sales_patterns sp ON im.sku_number = sp.sku_id AND im.store_number = sp.store_id\n),\nranked_reorders AS (\n  SELECT \n    rn.*,\n    otb.otb_remaining,\n    ROW_NUMBER() OVER (\n      PARTITION BY rn.shop_id, rn.store_number \n      ORDER BY rn.priority_score DESC, rn.reorder_cost DESC\n    ) as priority_rank,\n    SUM(rn.reorder_cost) OVER (\n      PARTITION BY rn.shop_id, rn.store_number \n      ORDER BY rn.priority_score DESC, rn.reorder_cost DESC \n      ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n    ) as cumulative_cost\n  FROM reorder_needs rn\n  LEFT JOIN otb_remaining otb \n    ON rn.shop_id = otb.shop_id \n    AND rn.store_number = otb.store_id\n  WHERE rn.suggested_reorder_qty > 0\n    AND rn.priority_score >= @min_priority_score\n)\nSELECT \n  sku_number,\n  store_number,\n  product_name,\n  style,\n  vendor,\n  shop_name,\n  current_on_hand,\n  units_sold_7d,\n  units_sold_30d,\n  days_of_supply,\n  priority_score,\n  suggested_reorder_qty,\n  ROUND(unit_cost, 2) as unit_cost,\n  ROUND(reorder_cost, 2) as reorder_cost,\n  ROUND(otb_remaining, 2) as otb_remaining,\n  ROUND(cumulative_cost, 2) as cumulative_cost,\n  CASE \n    WHEN cumulative_cost <= COALESCE(otb_remaining, 0) THEN 'Approved - Within Budget'\n    WHEN cumulative_cost - reorder_cost < COALESCE(otb_remaining, 0) AND \n         cumulative_cost > COALESCE(otb_remaining, 0) THEN 'Partial - Exceeds Budget'\n    ELSE 'Deferred - No Budget'\n  END as otb_status,\n  CASE \n    WHEN cumulative_cost <= COALESCE(otb_remaining, 0) THEN suggested_reorder_qty\n    WHEN cumulative_cost - reorder_cost < COALESCE(otb_remaining, 0) THEN \n      FLOOR((COALESCE(otb_remaining, 0) - (cumulative_cost - reorder_cost)) / unit_cost)\n    ELSE 0\n  END as approved_reorder_qty,\n  CASE \n    WHEN cumulative_cost <= COALESCE(otb_remaining, 0) THEN reorder_cost\n    WHEN cumulative_cost - reorder_cost < COALESCE(otb_remaining, 0) THEN \n      COALESCE(otb_remaining, 0) - (cumulative_cost - reorder_cost)\n    ELSE 0\n  END as approved_reorder_cost,\n  priority_rank\nFROM ranked_reorders\nORDER BY shop_id, store_number, priority_score DESC, reorder_cost DESC\n"
  get_margin_variance_report:
    kind: bigquery-sql
    source: bq-warehouse
    description: Generates margin comparisons (TY vs. LY) by vendor/shop, with pivots
      for monthly views. Identifies margin drivers for actions like vendor negotiations.
    parameters:
    - name: vendor_name
      type: string
      description: Vendor name to filter (empty for all vendors)
      default: ''
    - name: shop_id
      type: integer
      description: Shop ID to filter (0 for all shops)
      default: 0
    - name: period
      type: string
      description: Period type - ytd or monthly
      default: ytd
    - name: min_margin_var
      type: float
      description: Minimum margin variance percentage threshold
      default: 5.0
    - name: limit
      type: integer
      description: Number of results to return
      default: 50
    statement: "WITH ty_margin AS (\n  SELECT \n    skus.as400_data.vendor_name1 AS\
      \ vendor,\n    SAFE_DIVIDE(SUM(CASE \n      WHEN fs.price_extended < 0 THEN fs.price_extended - (-ABS(fs.cogs_extended))\n      ELSE fs.price_extended - fs.cogs_extended\n    END), SUM(fs.price_extended))\
      \ * 100 AS margin_pct_ty,\n    SUM(CASE \n      WHEN fs.price_extended < 0 THEN fs.price_extended - (-ABS(fs.cogs_extended))\n      ELSE fs.price_extended - fs.cogs_extended\n    END) AS\
      \ total_margin_ty,\n    SUM(fs.price_extended) AS total_revenue_ty,\n    SUM(fs.cogs_extended)\
      \ AS total_cost_ty\n  FROM `sis-data-marts.warehouse.fct_sales` fs\n  LEFT JOIN\
      \ `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id\n\
      \  WHERE DATE(fs.transaction_datetime) >= DATE_TRUNC(CURRENT_DATE(), YEAR)\n\
      \    AND (@shop_id = 0 OR skus.specialty_shop = @shop_id)\n    AND (skus.as400_data.vendor_name1\
      \ = @vendor_name OR @vendor_name = '')\n  GROUP BY vendor\n),\nly_margin AS\
      \ (\n  SELECT \n    skus.as400_data.vendor_name1 AS vendor,\n    SAFE_DIVIDE(SUM(CASE \n      WHEN fs.price_extended < 0 THEN fs.price_extended - (-ABS(fs.cogs_extended))\n      ELSE fs.price_extended - fs.cogs_extended\n    END), SUM(fs.price_extended)) * 100 AS margin_pct_ly,\n   \
      \ SUM(CASE \n      WHEN fs.price_extended < 0 THEN fs.price_extended - (-ABS(fs.cogs_extended))\n      ELSE fs.price_extended - fs.cogs_extended\n    END) AS total_margin_ly,\n    SUM(fs.price_extended)\
      \ AS total_revenue_ly,\n    SUM(fs.cogs_extended) AS total_cost_ly\n  FROM `sis-data-marts.warehouse.fct_sales`\
      \ fs\n  LEFT JOIN `sis-data-marts.warehouse.dim_skus` skus ON fs.sku_id = skus.dim_sku_id\n\
      \  WHERE DATE(fs.transaction_datetime) BETWEEN DATE_TRUNC(DATE_SUB(CURRENT_DATE(),\
      \ INTERVAL 1 YEAR), YEAR) \n    AND DATE_SUB(DATE_TRUNC(CURRENT_DATE(), YEAR),\
      \ INTERVAL 1 DAY)\n    AND (@shop_id = 0 OR skus.specialty_shop = @shop_id)\n\
      \    AND (skus.as400_data.vendor_name1 = @vendor_name OR @vendor_name = '')\n\
      \  GROUP BY vendor\n)\nSELECT \n  COALESCE(ty.vendor, ly.vendor) AS vendor,\n\
      \  ty.margin_pct_ty,\n  ly.margin_pct_ly,\n  ty.margin_pct_ty - ly.margin_pct_ly\
      \ AS margin_var_pct,\n  ty.total_margin_ty,\n  ly.total_margin_ly,\n  ty.total_margin_ty\
      \ - ly.total_margin_ly AS margin_dollar_var,\n  ty.total_revenue_ty,\n  ly.total_revenue_ly,\n\
      \  ty.total_cost_ty,\n  ly.total_cost_ly,\n  CASE \n    WHEN ty.margin_pct_ty\
      \ - ly.margin_pct_ly < -5 THEN 'Margin Erosion - Action Required'\n    WHEN\
      \ ty.margin_pct_ty - ly.margin_pct_ly > 5 THEN 'Margin Improvement'\n    ELSE\
      \ 'Stable Margin'\n  END AS margin_status\nFROM ty_margin ty\nFULL OUTER JOIN\
      \ ly_margin ly ON ty.vendor = ly.vendor\nWHERE ABS(COALESCE(ty.margin_pct_ty,\
      \ 0) - COALESCE(ly.margin_pct_ly, 0)) >= @min_margin_var\nORDER BY ABS(COALESCE(ty.margin_pct_ty,\
      \ 0) - COALESCE(ly.margin_pct_ly, 0)) DESC\nLIMIT @limit\n"
