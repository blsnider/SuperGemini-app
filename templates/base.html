<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Super Gemini Analytics{% endblock %}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    
    <!-- Core CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v={{ cache_buster }}">
    {% block extra_css %}{% endblock %}
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body data-page="{% block page_name %}default{% endblock %}">
    <!-- Sidebar Toggle Button -->
    <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">
        📊
    </button>
    
    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    
    <!-- Health Indicator -->
    <div class="health-indicator" id="healthIndicator">
        <span id="healthStatus">Checking...</span>
    </div>
    
    <!-- Version Badge -->
    <div class="version-badge" title="Version 2.9.1 - Restored cost tracking for LLM queries">v2.9.1</div>
    
    <div class="main-container">
        <!-- Collapsible Sidebar -->
        <div class="sidebar" id="sidebar">
            <h3>🚀 Navigation v2</h3>
            <!-- Force update: {{ cache_buster }} -->
            <div class="navigation-buttons">
                <button class="nav-button" data-nav="chat" onclick="showChatView()">
                    <i>💬</i> Chat Assistant
                </button>
                <button class="nav-button" data-nav="dashboard" onclick="showDashboard()">
                    <i>📊</i> Analytics Dashboard
                </button>
                <button class="nav-button" data-nav="seasonality" onclick="window.location.href='/seasonality'">
                    <i>🌱</i> Seasonality Config
                </button>
                <button class="nav-button" data-nav="tools" onclick="window.location.href='/tools'">
                    <i>🔧</i> Tools Catalog
                </button>
            </div>
            
            <!-- Session Cost Hidden per requirements -->
            <div style="display: none;">
                <h3>💰 Session Cost</h3>
                <div class="cost-display" id="costDisplay">
                    <h4>Current Session</h4>
                    <div class="cost-item">
                        <span>Total Cost:</span>
                        <span id="totalCost">$0.00</span>
                    </div>
                    <div class="cost-item">
                        <span>Queries:</span>
                        <span id="queryCount">0</span>
                    </div>
                    <div class="cost-item">
                        <span>Avg per Query:</span>
                        <span id="avgCost">$0.00</span>
                    </div>
                </div>
            </div>
            
            <!-- Query History Removed -->
            
            <h3 style="margin-top: 20px;">⚙️ Configuration</h3>
            <button class="nav-button" onclick="showModelConfig()" style="font-size: 0.9em;">
                <i>🤖</i> Configure Models
            </button>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            {% block content %}{% endblock %}
        </div>
    </div>
    
    <!-- Core JavaScript -->
    <script src="{{ url_for('static', filename='js/navigation.js') }}?v={{ cache_buster }}"></script>
    <script src="{{ url_for('static', filename='js/core.js') }}?v={{ cache_buster }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
